/* ============================================================
   日循环：上课 → 事件 → 自由时间 → 餐饮 → 夜间 → 日结算
   ============================================================ */

/* ---------- 数值内核 ---------- */
function addProf(courseId, delta, opts) {
  opts = opts || {};
  const c = state.courses[courseId];
  if (!c) return 0;
  if (delta > 0 && opts.weeklyCap) {
    const used = state.weekly.profGain[courseId] || 0;
    const room = Math.max(0, 16 - used);
    const applied = Math.min(delta, room);
    if (applied <= 0) return 0;
    state.weekly.profGain[courseId] = used + applied;
    c.prof = clamp(c.prof + applied, 0, 100);
    return applied;
  }
  c.prof = clamp(c.prof + delta, 0, 100);
  return delta;
}

function mergeEffects(base, extra) {
  if (!extra) return base;
  ['stamina', 'health', 'sanity', 'money', 'runCount', 'leaveCount', 'gameProf'].forEach(function (k) {
    if (extra[k]) base[k] = (base[k] || 0) + extra[k];
  });
  if (extra.prof) {
    if (base.prof) base.prof.delta += extra.prof.delta;
    else base.prof = clone(extra.prof);
  }
  if (extra.flag) base.flag = Object.assign({}, base.flag || {}, extra.flag);
  if (extra.maxStaminaNextDay) base.maxStaminaNextDay = extra.maxStaminaNextDay;
  if (extra.skipToday) base.skipToday = true;
  if (extra.skipNextDay) base.skipNextDay = true;
  if (extra.night) base.night = extra.night;
  return base;
}

function firstMajorCourseToday() {
  const grid = todayGrid();
  for (let i = 0; i < 5; i++) {
    if (grid[i] && COURSE_DEFS[grid[i]].type === 'major') return grid[i];
  }
  return null;
}

function applyProfEffect(pr, chosenCourse) {
  if (!pr) return;
  let ids = [];
  if (pr.course === 'all_major') ids = MAJOR_IDS.slice();
  else if (pr.course === 'firstMajorToday') {
    const first = firstMajorCourseToday();
    if (first) ids = [first];
  } else if (pr.course === 'choose') {
    if (chosenCourse) ids = [chosenCourse];
  } else if (state.courses[pr.course]) {
    ids = [pr.course];
  }
  ids.forEach(function (id) { addProf(id, pr.delta, { weeklyCap: false }); });
}

function skipTodayClasses() {
  const grid = todayGrid();
  let n = 0;
  grid.forEach(function (id) {
    if (id && COURSE_DEFS[id].type === 'major') {
      addProf(id, -5, { weeklyCap: false });
      if (state.day.skippedCourses.indexOf(id) < 0) state.day.skippedCourses.push(id);
      n++;
    }
  });
  if (n) pushLog('今天全部课程请假：' + n + ' 节专业课熟练度 -5。');
}

/* 课间「翘课」：只结算尚未上的课，每节对应课程熟练度 -5；不把课时换成自由格，防止刷自由时间 */
function skipRemainingClasses() {
  const d = state.day;
  if (!d || !Array.isArray(d.classPlan)) return;
  let skipped = 0, majorCount = 0;
  for (let i = d.classIndex; i < d.classPlan.length; i++) {
    const id = d.classPlan[i].id;
    if (!COURSE_DEFS[id]) continue;
    if (COURSE_DEFS[id].type === 'major') {
      addProf(id, -5, { weeklyCap: false });
      if (d.skippedCourses.indexOf(id) < 0) d.skippedCourses.push(id);
      majorCount++;
    }
    skipped++;
  }
  d.classIndex = d.classPlan.length;
  d.classesRemaining = 0;
  if (skipped > 0) {
    pushLog('翘课：跳过剩余 ' + skipped + ' 节（' + majorCount + ' 节专业课各 -5 熟练度），不额外获得自由格。');
  }
}

function applyEffects(eff, chosenCourse) {
  if (!eff) return;
  const p = state.player;
  if (eff.stamina) p.stamina = clamp(p.stamina + eff.stamina, 0, (state.day && state.day.staminaCap) || 100);
  if (eff.health) p.health = clamp(p.health + eff.health, 0, 100);
  if (eff.sanity) p.sanity = clamp(p.sanity + eff.sanity, 0, 100);
  if (eff.gameProf) addGameProf(eff.gameProf);
  if (eff.money) p.money = Math.max(0, p.money + eff.money);
  if (eff.runCount) p.runCount = Math.max(0, p.runCount + eff.runCount);
  if (eff.leaveCount) p.leaveCount = Math.max(0, p.leaveCount + eff.leaveCount);
  if (eff.prof) applyProfEffect(eff.prof, chosenCourse);
  if (eff.flag) Object.assign(state.flags, eff.flag);
  if (eff.maxStaminaNextDay) p.maxStaminaNextDay = eff.maxStaminaNextDay;
  if (eff.skipToday) skipTodayClasses();
  if (eff.skipRemaining) skipRemainingClasses();
  if (eff.skipNextDay) {
    p.skipClassNextDay = true;
    p.skipClassReason = 'event';
    pushLog('明天的课程将全部缺席。');
  }
  if (eff.night) {
    state.day.nightOverride = {
      kind: eff.night,
      provided: { stamina: !!eff.stamina, health: !!eff.health, sanity: !!eff.sanity }
    };
  }
}

function triggerExhaustion() {
  if (state.day.exhausted) return;
  state.day.exhausted = true;
  state.flags.fainted = true;
  state.day.classesRemaining = 0;
  MAJOR_IDS.forEach(function (id) { addProf(id, -5, { weeklyCap: false }); });
  pushLog('体力见底：强制昏睡，跳过全部剩余行动，全科熟练度 -5。');
}

/* ---------- 上课（逐节推进） ---------- */
const CLASS_EVENT_CHANCE = 0.35;   /* 每节课后触发课间事件的概率 */
const CLASS_EVENT_DAILY_CAP = 2;   /* 单日课间事件上限 */

function buildClassPlan(grid) {
  const plan = [];
  for (let s = 0; s < 5; s++) if (grid[s]) plan.push({ slot: s, id: grid[s] });
  return plan;
}

/* 上一节课：单独结算体力、熟练度、单科周上限与当天节数 */
function attendClass() {
  const d = state.day;
  const p = state.player;
  if (!d || d.classesFinished) return;
  if (d.exhausted) { finishClasses(); return; }
  const plan = d.classPlan || [];
  if (d.classIndex >= plan.length) { finishClasses(); return; }
  const cls = plan[d.classIndex];
  const id = cls.id;
  const before = p.stamina;
  if (before < 50) d.lowStaminaClasses++;
  p.stamina = clamp(p.stamina - 5, 0, 100);
  let gain = 0;
  if (COURSE_DEFS[id] && COURSE_DEFS[id].type === 'major') {
    const wc = state.weekly.classCount[id] || 0;
    const base = wc >= 5 ? 1 : 2;
    state.weekly.classCount[id] = wc + 1;
    gain = addProf(id, base, { weeklyCap: true });
  }
  d.classIndex++;
  d.classesRun++;
  d.classesRemaining = Math.max(0, plan.length - d.classIndex);
  const used = before - p.stamina;
  ui.classResults.push({ slot: cls.slot, id: id, stamina: used, gain: gain, session: d.classesRun, total: d.classTotal });
  pushLog('第 ' + d.classesRun + ' / ' + d.classTotal + ' 节：' + (COURSE_DEFS[id] ? COURSE_DEFS[id].name : id) +
    '，体力 -' + used + (gain > 0 ? '，熟练度 +' + gain : '') +
    '（剩余 ' + d.classesRemaining + ' 节）。');
  if (p.stamina <= 0) {
    ui.classResults.push({ exhaust: true });
    triggerExhaustion();
    finishClasses();
    return;
  }
  afterClass();
}

/* 两节课之间：按概率触发课间事件；无事发生则直接进入下一节 */
function afterClass() {
  const d = state.day;
  if (!d) return;
  if (d.classesRemaining <= 0) { finishClasses(); return; }
  if (d.classEventCount < CLASS_EVENT_DAILY_CAP && random() < CLASS_EVENT_CHANCE) {
    const ev = rollClassEvent();
    if (ev) {
      d.classEventCount++;
      d.classEventIds.push(ev.id);
      ui.currentEvent = ev;
      ui.eventKind = 'class';
      ui.phase = 'classEvent';
      pushLog('第 ' + d.classesRun + ' 节后 · 课间：触发「' + ev.title + '」（今日课间事件 ' +
        d.classEventCount + ' / ' + CLASS_EVENT_DAILY_CAP + '）。');
      renderAll();
      return;
    }
  }
  pushLog('第 ' + d.classesRun + ' 节后 · 课间：平静（未触发事件，剩余 ' + d.classesRemaining + ' 节）。');
  ui.phase = 'classSession';
  renderAll();
}

/* 当天课程结束：按「实际上了几节」结算理智分档与高强度日 */
function finishClasses() {
  const d = state.day;
  const p = state.player;
  if (!d) { ui.phase = 'classRun'; renderAll(); return; }
  if (!d.classesFinished) {
    d.classesFinished = true;
    const count = d.classesRun;
    let loss = count >= 5 ? -15 : count === 4 ? -8 : count === 3 ? -3 : 0;
    if (count >= 3) {
      p.highIntensityDays++;
      const h = p.highIntensityDays;
      if (h === 3) loss -= 2;
      else if (h === 4) loss -= 5;
      else if (h >= 5) loss -= 8;
    } else {
      p.highIntensityDays = 0;
    }
    if (d.lowStaminaClasses > 0) {
      loss -= d.lowStaminaClasses * 2;
      pushLog('体力低于 50 时上课，' + d.lowStaminaClasses + ' 节额外理智 -' + (d.lowStaminaClasses * 2) + '。');
    }
    p.sanity = clamp(p.sanity + loss, 0, 100);
    pushLog('今天实际上课 ' + count + ' / ' + (d.classTotal || 0) + ' 节，理智 ' +
      (loss > 0 ? '+' : '') + loss +
      (p.highIntensityDays >= 3 ? '（连续高强度第 ' + p.highIntensityDays + ' 天）' : '') + '。');
    if (p.sanity <= 0 && !p.isCollapsed) { triggerCollapse('finishClasses'); return; }
  }
  ui.phase = 'classRun';
  renderAll();
}

function startToday() {
  const t = state.time;
  const p = state.player;
  state.day = initDay();
  const grid = t.week === 10 ? [null, null, null, null, null] : todayGrid();
  state.day.freeSlotsLeft = 5 - grid.filter(Boolean).length;
  state.day.classesRemaining = t.week === 10 ? 0 : grid.filter(Boolean).length;
  state.day.staminaCap = 100 + (p.maxStaminaNextDay || 0);
  p.maxStaminaNextDay = 0;
  if (p.stamina > state.day.staminaCap) p.stamina = state.day.staminaCap;
  state.day.startSnapshot = {
    stamina: p.stamina, health: p.health, sanity: p.sanity, money: p.money
  };

  ui.eventQueue = [];
  ui.classResults = [];
  ui.currentEvent = null;
  ui.eventKind = null;
  if (t.week === 5 && t.dayOfWeek === 1 && !state.flags.e29_done && getEventById('E29')) {
    ui.eventQueue.push('E29');
  }

  if (p.skipClassNextDay) {
    const reason = p.skipClassReason || 'collapse';
    state.day.classesRemaining = 0;
    state.day.classTotal = grid.filter(Boolean).length;
    grid.forEach(function (id) {
      if (id && COURSE_DEFS[id].type === 'major') {
        state.day.skippedCourses.push(id);
        if (reason !== 'collapse') addProf(id, -5, { weeklyCap: false });
      }
    });
    p.skipClassNextDay = false;
    p.skipClassReason = null;
    pushLog('全天课程缺席（' + (reason === 'collapse' ? '崩溃旷课' : '事件') + '）。');
    ui.classResults.push({ skipped: true });
    ui.phase = 'classRun';
    renderAll();
    return;
  }
  if (t.week === 10) {
    ui.classResults.push({ free: true });
    ui.phase = 'classRun';
    renderAll();
    return;
  }

  const plan = buildClassPlan(grid);
  state.day.classPlan = plan;
  state.day.classTotal = plan.length;
  state.day.classIndex = 0;
  state.day.classesRun = 0;
  state.day.classesRemaining = plan.length;
  state.day.classEventCount = 0;
  state.day.classEventIds = [];
  state.day.lowStaminaClasses = 0;
  state.day.classesFinished = false;
  pushLog('今日课表共 ' + plan.length + ' 节，开始逐节上课。');
  if (!plan.length) { finishClasses(); return; }
  if (p.stamina <= 0) { triggerExhaustion(); finishClasses(); return; }
  ui.phase = 'classSession';
  renderAll();
}

/* ---------- 事件抽取 ---------- */
function todayHasCourse(courseId) {
  if (!courseId) return true;
  const grid = state.time.week === 10 ? [null, null, null, null, null] : todayGrid();
  return grid.indexOf(courseId) >= 0;
}

function conditionOk(ev) {
  const c = ev.condition || {};
  const t = state.time;
  const p = state.player;
  if (c.minWeek && t.week < c.minWeek) return false;
  if (c.maxWeek && t.week > c.maxWeek) return false;
  if (c.requiresCourseToday && !todayHasCourse(c.requiresCourseToday)) return false;
  if (c.requiresRunCountMin !== undefined && p.runCount < c.requiresRunCountMin) return false;
  if (c.sanityBelow !== undefined && c.sanityBelow !== null && p.sanity >= c.sanityBelow) return false;
  if (c.staminaBelow !== undefined && c.staminaBelow !== null && p.stamina >= c.staminaBelow) return false;
  if (c.moneyBelow !== undefined && c.moneyBelow !== null && p.money >= c.moneyBelow) return false;
  if (c.flagRequired && !state.flags[c.flagRequired]) return false;
  if (c.flagMissing && state.flags[c.flagMissing]) return false;
  return true;
}

function getEventById(id) {
  for (let i = 0; i < EVENTS.length; i++) if (EVENTS[i].id === id) return EVENTS[i];
  return null;
}

function rollEvent() {
  if (!EVENTS.length) return null;
  const es = state.eventState;
  const turn = state.meta.turnIndex;
  const pool = [];
  let total = 0;
  EVENTS.forEach(function (ev) {
    if (!ev.weight || ev.weight <= 0) return;
    if (!conditionOk(ev)) return;
    const last = es.lastTrigger[ev.id];
    if (last !== undefined && turn - last < 5) return;
    let w = ev.weight;
    if (ev.weekWeight && ev.weekWeight[state.time.week]) w = ev.weekWeight[state.time.week];
    if (es.turnsSinceRare >= 3 && ev.weight <= 15) w *= 2;
    pool.push({ ev: ev, w: w });
    total += w;
  });
  if (!pool.length || total <= 0) return null;
  let roll = random() * total;
  let picked = pool[pool.length - 1].ev;
  for (let i = 0; i < pool.length; i++) {
    roll -= pool[i].w;
    if (roll <= 0) { picked = pool[i].ev; break; }
  }
  es.lastTrigger[picked.id] = turn;
  if (picked.weight <= 15) es.turnsSinceRare = 0;
  else es.turnsSinceRare = (es.turnsSinceRare || 0) + 1;
  return picked;
}

/* 课间事件抽取：同一天不重复，独立于 50 个日常事件 */
function rollClassEvent() {
  if (!CLASS_EVENTS.length) return null;
  const d = state.day;
  const today = d.classEventIds || [];
  const pool = [];
  let total = 0;
  CLASS_EVENTS.forEach(function (ev) {
    if (!ev.weight || ev.weight <= 0) return;
    if (today.indexOf(ev.id) >= 0) return;
    if (!conditionOk(ev)) return;
    pool.push({ ev: ev, w: ev.weight });
    total += ev.weight;
  });
  if (!pool.length || total <= 0) return null;
  let roll = random() * total;
  let picked = pool[pool.length - 1].ev;
  for (let i = 0; i < pool.length; i++) {
    roll -= pool[i].w;
    if (roll <= 0) { picked = pool[i].ev; break; }
  }
  return picked;
}

function beginEvent() {
  const p = state.player;
  if (state.day.exhausted) { enterMeals(); return; }
  if (p.sanity <= 0 && !p.isCollapsed) { triggerCollapse('beginEvent'); return; }
  let ev = null;
  if (state.day.eventCount === 0) {
    ev = rollEvent();
    if (!ev && ui.eventQueue && ui.eventQueue.length) ev = getEventById(ui.eventQueue.shift());
  } else if (ui.eventQueue && ui.eventQueue.length) {
    ev = getEventById(ui.eventQueue.shift());
  }
  if (!ev) {
    pushLog('今天没有触发随机事件。');
    enterFreeTime();
    return;
  }
  ui.currentEvent = ev;
  ui.eventKind = 'daily';
  state.day.eventCount++;
  pushLog('课程结束 · 日常事件：' + ev.title + '（' + ev.id + '）。');
  if (ev.id === 'E29') state.flags.e29_done = true;
  if (ev.id === 'E24') state.flags.e24_seen = true;
  if (ev.id === 'E31') {
    state.player.money = Math.max(0, state.player.money - 10);
    pushLog('食堂多刷了 ¥10（已在当日餐饮中扣除）。');
  }
  ui.phase = 'event';
  renderAll();
}

function optNeedsCourse(opt) {
  return !!(opt.effects && opt.effects.prof && opt.effects.prof.course === 'choose');
}

function chooseOption(idx) {
  const ev = ui.currentEvent;
  if (!ev) return;
  const opt = ev.options[idx];
  if (!opt) return;
  if (opt.risky && state.player.sanity >= 40) return;
  if (opt.effects && opt.effects.leaveCount < 0 && state.player.leaveCount <= 0) return;
  ui.pendingOption = opt;
  if (optNeedsCourse(opt)) {
    ui.phase = 'chooseCourse';
    renderAll();
    return;
  }
  applyPendingOption(null);
}

/* 文档 6.3：低理智专属选项（理智 < 40 解锁） */
function examSoon() {
  const t = state.time;
  if (t.week === 9 && t.dayOfWeek >= 3) return true;
  if (t.week === 10 && t.dayOfWeek >= 5) return true;
  return false;
}

/* 所有专业课都到 100 时，「豁出去了」已无处可加 */
function hasProfRoom() {
  return MAJOR_IDS.some(function (id) { return (state.courses[id].prof || 0) < 100; });
}

/* 文档 6.3：只有「课间阶段 + 当天仍有未上的课」才可翘课。
   日常事件发生在课程全部结束之后（classesRemaining=0），因此不会出现；自由时间、结算阶段一律不出现。 */
function canSlackToday() {
  if (state.time.week === 10) return false;
  const d = state.day;
  if (!d || d.exhausted) return false;
  if (ui.phase !== 'classEvent') return false;
  return (d.classesRemaining || 0) > 0;
}

function chooseLowSanity(kind) {
  const p = state.player;
  if (p.sanity >= 40) return;
  let opt = null;
  if (kind === 'desperate') {
    if (!hasProfRoom()) return;
    opt = { text: '豁出去了', effects: { health: -12, sanity: -5, prof: { course: 'choose', delta: 10 } }, resultText: '你硬撑着啃完一章，感觉半条命没了。', chance: null, risky: true };
  } else if (kind === 'slack') {
    if (!canSlackToday()) return;
    opt = { text: '翘课回宿舍躺平', effects: { sanity: 18, stamina: 20, skipRemaining: true }, resultText: '你回宿舍倒头就睡，醒来天已经黑了。', chance: null, risky: true };
  } else if (kind === 'grind') {
    if (!examSoon()) return;
    opt = { text: '通宵突击', effects: { health: -15, sanity: -10, maxStaminaNextDay: -20, prof: { course: 'choose', delta: 15 }, night: 'allnight' }, resultText: '天亮时你合上书，手一直在抖。', chance: null, risky: true };
  }
  if (!opt) return;
  ui.pendingOption = opt;
  if (optNeedsCourse(opt)) {
    ui.phase = 'chooseCourse';
    renderAll();
    return;
  }
  applyPendingOption(null);
}

function chooseCourseFor(courseId) {
  applyPendingOption(courseId);
}

function applyPendingOption(chosenCourse) {
  const opt = ui.pendingOption;
  const ev = ui.currentEvent;
  if (!opt) return;
  let eff = clone(opt.effects || {});
  let failed = false;
  if (opt.chance && random() < opt.chance.p) {
    failed = true;
    if (opt.chance.replace) eff = clone(opt.chance.failEffects || {});
    else mergeEffects(eff, opt.chance.failEffects);
  }
  applyEffects(eff, chosenCourse);
  const text = (failed && opt.chance.failText) ? opt.chance.failText : opt.resultText;
  ui.eventResultText = text;
  ui.eventResultFailed = failed;
  pushLog('「' + ev.title + '」' + opt.text + ' → ' + text);
  ui.pendingOption = null;
  if (state.player.health <= 0) { endGame('D', '生命归零'); return; }
  ui.phase = 'eventResult';
  if (state.player.sanity <= 0) { triggerCollapse('eventResult'); return; }
  renderAll();
}

function continueEvent() {
  if (ui.eventKind === 'class') { continueClassFlow(); return; }
  if (ui.eventQueue && ui.eventQueue.length) { beginEvent(); return; }
  enterFreeTime();
}

/* 课间事件结束后：还有课就回到「第 N 节」，否则进入当天课程结算 */
function continueClassFlow() {
  const d = state.day;
  ui.eventKind = null;
  ui.currentEvent = null;
  if (!d) { enterFreeTime(); return; }
  if (state.player.sanity <= 0 && !state.player.isCollapsed) { triggerCollapse('continueClass'); return; }
  if (state.player.stamina <= 0) { triggerExhaustion(); finishClasses(); return; }
  if (d.exhausted) { finishClasses(); return; }
  if ((d.classesRemaining || 0) > 0) {
    ui.phase = 'classSession';
    pushLog('课间结束，准备上第 ' + (d.classesRun + 1) + ' / ' + d.classTotal + ' 节。');
    renderAll();
    return;
  }
  finishClasses();
}

/* ---------- 自由时间 ---------- */
function effectiveReviewGain(courseId) {
  const t = state.time;
  let g;
  if (t.week === 10) {
    g = t.dayOfWeek === 1 ? 6 : t.dayOfWeek === 2 ? 4 : t.dayOfWeek === 3 ? 2 : 1;
  } else {
    g = state.player.studyKitThisWeek ? 4 : 2;
    const room = 16 - (state.weekly.profGain[courseId] || 0);
    g = Math.min(g, Math.max(0, room));
  }
  return g;
}

function enterFreeTime() {
  if (state.day.exhausted) { enterMeals(); return; }
  pushLog('进入自由时间：可安排 ' + state.day.freeSlotsLeft + ' 个自由格。');
  ui.phase = 'freeTime';
  renderAll();
}

/* 游戏熟练度：每周最多 +18，100 封顶，不衰减 */
function addGameProf(delta) {
  const p = state.player;
  const room = Math.max(0, 18 - (state.weekly.gameProfGain || 0));
  if (room <= 0) return 0;
  const before = p.gameProf || 0;
  if (before >= 100) return 0;
  const target = clamp(before + Math.min(delta, room), 0, 100);
  const applied = target - before;   /* 只按真实增加量计周额度，100 封顶不消耗额度 */
  if (applied <= 0) return 0;
  p.gameProf = target;
  state.weekly.gameProfGain = (state.weekly.gameProfGain || 0) + applied;
  return applied;
}

/* 游戏熟练无法增加时的可见原因 */
function gameProfCapReason() {
  const p = state.player;
  if ((p.gameProf || 0) >= 100) return '游戏熟练已达 100 上限';
  if ((state.weekly.gameProfGain || 0) >= 18) return '本周游戏熟练度已达上限（+18），周一重置';
  return '';
}

function doFreeAction(kind, courseId) {
  const d = state.day;
  const p = state.player;
  if (!d) return;
  if (d.freeSlotsLeft <= 0) {
    pushLog('没有剩余自由格了，请点击「结束自由时间」。');
    renderAll();
    return;
  }

  if (kind === 'review') {
    if (!courseId) return;
    if ((d.reviewsByCourse[courseId] || 0) >= 2) return;
    if (d.skippedCourses.indexOf(courseId) >= 0) return;
    const g = effectiveReviewGain(courseId);
    if (g <= 0) return;
    p.stamina = clamp(p.stamina - 4, 0, 100);
    p.sanity = clamp(p.sanity - 2, 0, 100);
    const applied = addProf(courseId, g, { weeklyCap: state.time.week !== 10 });
    d.reviewsByCourse[courseId] = (d.reviewsByCourse[courseId] || 0) + 1;
    d.freeSlotsLeft--;
    pushLog('复习 ' + COURSE_DEFS[courseId].name + ' 1 格：熟练度 +' + applied + '（体力 -4 / 理智 -2）。');
  } else if (kind === 'rest') {
    p.stamina = clamp(p.stamina + 12, 0, d.staminaCap || 100);
    p.sanity = clamp(p.sanity + 4, 0, 100);
    d.freeSlotsLeft--;
    pushLog('平时休息 1 格：体力 +12，理智 +4。');
  } else if (kind === 'nap') {
    p.stamina = clamp(p.stamina + 20, 0, d.staminaCap || 100);
    p.sanity = clamp(p.sanity + 3, 0, 100);
    d.freeSlotsLeft--;
    pushLog('午睡 1 格：体力 +20，理智 +3。');
  } else if (kind === 'run') {
    if (d.runToday >= 1) return;
    p.stamina = clamp(p.stamina - 8, 0, 100);
    p.sanity = clamp(p.sanity + 3, 0, 100);
    p.runCount++;
    d.runToday++;
    d.freeSlotsLeft--;
    pushLog('校园跑 1 次：体力 -8，理智 +3，累计 ' + p.runCount + ' / 50。');
  } else if (kind === 'work') {
    p.stamina = clamp(p.stamina - 10, 0, 100);
    p.sanity = clamp(p.sanity - 4, 0, 100);
    p.money += 50;
    state.runStats.workIncome = (state.runStats.workIncome || 0) + 50;
    d.freeSlotsLeft--;
    pushLog('兼职 1 格：¥+50，体力 -10，理智 -4。');
  } else if (kind === 'social') {
    if (state.time.week < 5 || p.money < 15) return;
    p.stamina = clamp(p.stamina - 4, 0, 100);
    p.sanity = clamp(p.sanity + 10, 0, 100);
    p.money -= 15;
    d.freeSlotsLeft--;
    pushLog('社团 / 社交 1 格：理智 +10，¥-15。');
  } else if (kind === 'game') {
    const n = p.gameCountThisWeek;
    const gain = n === 0 ? 8 : n === 1 ? 5 : 1;
    const gp = addGameProf(6);
    p.stamina = clamp(p.stamina - 5, 0, 100);
    p.sanity = clamp(p.sanity + gain, 0, 100);
    p.gameCountThisWeek++;
    d.freeSlotsLeft--;
    pushLog('打游戏 1 格：理智 +' + gain + '（本周第 ' + (n + 1) + ' 次），体力 -5，游戏熟练 +' + gp + '。' +
      (gp <= 0 ? gameProfCapReason() + '，本次只回理智。' : ''));
  } else if (kind === 'coop') {
    if (p.gameProf < 40) return;
    if (p.money < 10) return;
    const gp = addGameProf(2);
    p.stamina = clamp(p.stamina - 6, 0, 100);
    p.sanity = clamp(p.sanity + 22, 0, 100);
    p.money -= 10;
    d.freeSlotsLeft--;
    pushLog('和朋友开黑 1 格：理智 +22，体力 -6，¥-10，游戏熟练 +' + gp + '。' +
      (gp <= 0 ? gameProfCapReason() + '。' : ''));
  } else if (kind === 'boost') {
    if (p.gameProf < 70) return;
    if ((p.proxyCountThisWeek || 0) >= 2) return;
    const gp = addGameProf(2);
    p.stamina = clamp(p.stamina - 12, 0, 100);
    p.sanity = clamp(p.sanity - 3, 0, 100);
    p.money += 45;
    p.proxyCountThisWeek = (p.proxyCountThisWeek || 0) + 1;
    d.freeSlotsLeft--;
    pushLog('游戏代练 1 格：¥+45，体力 -12，理智 -3，游戏熟练 +' + gp + '（本周第 ' + p.proxyCountThisWeek + ' / 2 次）。' +
      (gp <= 0 ? gameProfCapReason() + '。' : ''));
  } else {
    return;
  }

  if (p.sanity <= 0 && !p.isCollapsed) { triggerCollapse('freeTime'); return; }
  if (p.stamina <= 0) { triggerExhaustion(); enterMeals(); return; }
  renderAll();
}

/* ---------- 餐饮 ---------- */
function enterMeals() {
  ui.mealPlan = { breakfast: 'eat', lunch: 'eat', dinner: 'eat' };
  ui.phase = 'meals';
  renderAll();
}

function toggleMeal(id) {
  if (!ui.mealPlan) return;
  ui.mealPlan[id] = ui.mealPlan[id] === 'eat' ? 'skip' : 'eat';
  renderCenter();
}

function confirmMeals() {
  const p = state.player;
  const d = state.day;
  let eaten = 0, missed = 0;
  const ateBreakfast = (ui.mealPlan.breakfast === 'eat' && p.money >= MEAL_DEFS[0].price);
  MEAL_DEFS.forEach(function (m) {
    const plan = ui.mealPlan[m.id];
    if (plan === 'eat' && p.money >= m.price) {
      p.money -= m.price;
      eaten++;
    } else {
      p.health = clamp(p.health - 5, 0, 100);
      missed++;
      pushLog((plan === 'eat' ? m.name + '余额不足，自动漏餐' : m.name + '主动省餐') + '：生命 -5。');
    }
  });
  if (ateBreakfast) state.runStats.breakfastSkipStreak = 0;
  else state.runStats.breakfastSkipStreak = (state.runStats.breakfastSkipStreak || 0) + 1;
  d.mealsEaten = eaten;
  d.missedMeals = missed;
  d.ateAll = (missed === 0);
  pushLog('餐饮结算：用餐 ' + eaten + ' 顿' + (missed ? '，漏餐 ' + missed + ' 顿（生命 -' + (missed * 5) + '）' : '') + '。');
  if (d.ateAll) {
    state.weekly.mealStreak = (state.weekly.mealStreak || 0) + 1;
    if (state.weekly.mealStreak % 3 === 0) {
      p.health = clamp(p.health + 5, 0, 100);
      pushLog('连续 3 天吃满三餐：生命 +5。');
    }
  } else {
    state.weekly.mealStreak = 0;
  }
  if (p.health <= 0) { endGame('D', '生命归零（漏餐）'); return; }
  enterNight();
}

/* ---------- 夜间 ---------- */
function enterNight() {
  if (state.day && state.day.nightOverride) { autoNightOverride(); return; }
  ui.phase = 'night';
  renderAll();
}

/* 文档 6.2.1：事件显式写了的数值以事件为准，未写的仍走夜间硬性默认 */
function autoNightOverride() {
  const p = state.player;
  const ov = state.day.nightOverride;
  const cap = state.day.staminaCap || 100;
  const late = ov.kind === 'late';
  if (!ov.provided.stamina) p.stamina = clamp(p.stamina + (late ? 10 : 0), 0, cap);
  if (!ov.provided.health) p.health = clamp(p.health - (late ? 8 : 15), 0, 100);
  if (!ov.provided.sanity) p.sanity = clamp(p.sanity - (late ? 5 : 10), 0, 100);
  state.weekly.hadLateNight = true;
  pushLog('事件已占用夜间：' + (late ? '熬夜' : '通宵') + '，跳过作息选择（未提及的数值按硬性默认结算）。');
  state.day.nightOverride = null;
  if (p.health <= 0) { endGame('D', '生命归零（事件通宵）'); return; }
  finishDay(false);
}

function doNight(kind, courseId) {
  const p = state.player;
  const cap = state.day.staminaCap || 100;
  if (kind === 'allStudy') state.runStats.allNightStreak = (state.runStats.allNightStreak || 0) + 1;
  else state.runStats.allNightStreak = 0;
  if (kind === 'sleep') {
    p.stamina = clamp(p.stamina + 30, 0, cap);
    pushLog('正常睡觉：体力 +30。');
  } else if (kind === 'lateStudy') {
    if (!courseId) return;
    const applied = addProf(courseId, 7, { weeklyCap: state.time.week !== 10 });
    p.stamina = clamp(p.stamina + 10, 0, cap);
    p.health = clamp(p.health - 8, 0, 100);
    p.sanity = clamp(p.sanity - 5, 0, 100);
    state.weekly.hadLateNight = true;
    pushLog('熬夜复习 ' + COURSE_DEFS[courseId].name + '：熟练度 +' + applied + '，体力 +10，生命 -8，理智 -5。');
  } else if (kind === 'lateGame') {
    const gp = addGameProf(5);
    p.stamina = clamp(p.stamina + 10, 0, cap);
    p.health = clamp(p.health - 8, 0, 100);
    p.sanity = clamp(p.sanity + 8, 0, 100);
    state.weekly.hadLateNight = true;
    pushLog('熬夜打游戏：游戏熟练 +' + gp + '，体力 +10，生命 -8，理智 +8。');
  } else if (kind === 'allStudy') {
    if (!courseId) return;
    const applied = addProf(courseId, 15, { weeklyCap: state.time.week !== 10 });
    p.stamina = clamp(p.stamina + 0, 0, cap);
    p.health = clamp(p.health - 15, 0, 100);
    p.sanity = clamp(p.sanity - 10, 0, 100);
    state.weekly.hadLateNight = true;
    pushLog('通宵突击 ' + COURSE_DEFS[courseId].name + '：熟练度 +' + applied + '，体力 +0，生命 -15，理智 -10。');
  } else {
    return;
  }
  if (p.health <= 0) { endGame('D', '生命归零（夜间）'); return; }
  if (p.sanity <= 0 && !p.isCollapsed) { triggerCollapse('finishDay'); return; }
  finishDay(false);
}

/* ---------- 日结算 ---------- */
function finishDay(afterCollapse) {
  const p = state.player;
  if (!afterCollapse && p.sanity > 0 && p.sanity < 40) {
    p.sanity = clamp(p.sanity - 3, 0, 100);
    pushLog('理智低于 40，雪崩：每日 -3。');
  }
  if (p.health <= 0) { endGame('D', '生命归零'); return; }
  if (p.sanity <= 0 && !p.isCollapsed) { triggerCollapse('finishDay'); return; }

  state.meta.turnIndex++;
  const snap = state.day.startSnapshot || { stamina: p.stamina, health: p.health, sanity: p.sanity, money: p.money };
  ui.daySummary = {
    title: dayText(state.time.week, state.time.dayOfWeek),
    stamina: p.stamina - snap.stamina,
    health: p.health - snap.health,
    sanity: p.sanity - snap.sanity,
    money: p.money - snap.money,
    staminaNow: p.stamina, healthNow: p.health, sanityNow: p.sanity, moneyNow: p.money,
    meals: state.day.mealsEaten,
    missed: state.day.missedMeals,
    exhausted: state.day.exhausted
  };
  ui.phase = 'dayEnd';
  saveGame();
  renderAll();
}

function continueDay() {
  advanceDay();
}

function advanceDay() {
  const t = state.time;
  if (t.week <= 9 && t.dayOfWeek === 5) { settleWeek(); return; }
  if (t.week === 10 && t.dayOfWeek === 7) { showRetakeExam(); return; }
  t.dayOfWeek++;
  beginDay();
}

function beginDay() {
  if (state.player.restSkipDays > 0) { processRestDay(); return; }
  ui.phase = 'dayStart';
  renderAll();
}

/* 跳过天数：旷课 3 天 / 请假 2 天，逐日自动结算餐费、理智雪崩与体力恢复 */
function processRestDay() {
  const p = state.player;
  const absent = p.skipMode === 'absent';
  p.restSkipDays--;
  p.stamina = clamp(p.stamina + 30, 0, (state.day && state.day.staminaCap) || 100);
  if (!absent) p.sanity = clamp(p.sanity + 5, 0, 100);
  if (p.sanity > 0 && p.sanity < 40) {
    p.sanity = clamp(p.sanity - 3, 0, 100);
    pushLog('跳过日理智低于 40，雪崩 -3。');
  }
  let eaten = 0, missed = 0;
  MEAL_DEFS.forEach(function (m) {
    if (p.money >= m.price) { p.money -= m.price; eaten++; }
    else { p.health = clamp(p.health - 5, 0, 100); missed++; }
  });
  /* 与原餐饮结算一致：吃满三餐累计连吃天数，每 3 天生命 +5 */
  if (eaten === MEAL_DEFS.length) {
    state.weekly.mealStreak = (state.weekly.mealStreak || 0) + 1;
    if (state.weekly.mealStreak % 3 === 0) {
      p.health = clamp(p.health + 5, 0, 100);
      pushLog('跳过日连续 3 天吃满三餐：生命 +5。');
    }
  } else {
    state.weekly.mealStreak = 0;
  }
  pushLog((absent ? '旷课日' : '请假休息') + '：体力 +30' + (absent ? '' : '，理智 +5') +
    '，自动用餐 ' + eaten + ' 餐' + (missed ? '，漏餐 ' + missed + ' 顿（生命 -' + (5 * missed) + '）' : '') + '。');
  if (p.health <= 0) { endGame('D', absent ? '旷课期间生命归零' : '请假期间生命归零'); return; }
  saveGame();
  const t = state.time;
  if (p.restSkipDays <= 0) { p.skipMode = null; p.skipClassNextDay = false; p.skipClassReason = null; }
  if (t.week <= 9 && t.dayOfWeek === 5) { settleWeek(); return; }
  if (t.week === 10 && t.dayOfWeek === 7) { showRetakeExam(); return; }
  t.dayOfWeek++;
  beginDay();
}

/* ---------- 周结算 ---------- */
function settleWeek() {
  const p = state.player;
  const w = state.weekly;
  const hadLate = w.hadLateNight;
  p.money += 425;
  let utilPaid = 0;
  if (p.money >= 60) { p.money -= 60; utilPaid = 60; }
  else { utilPaid = p.money; p.money = 0; }
  let kitPaid = false;
  if (p.money >= 40) { p.money -= 40; kitPaid = true; }
  p.studyKitThisWeek = kitPaid;
  let sleepGain = 0;
  if (!hadLate) {
    p.health = clamp(p.health + 8, 0, 100);
    sleepGain = 8;
  }
  p.gameCountThisWeek = 0;
  p.proxyCountThisWeek = 0;
  p.highIntensityDays = 0;
  w.hadLateNight = false;
  w.gameProfGain = 0;
  MAJOR_IDS.forEach(function (id) { w.profGain[id] = 0; });
  ALL_IDS.forEach(function (id) { w.classCount[id] = 0; });

  pushLog('周结算：生活费 +425，水电/交通 -' + utilPaid + '，资料费' +
    (kitPaid ? '已缴 -40' : '未缴（下周复习收益减半）') +
    (sleepGain ? '，周末补觉 +8 生命。' : '，当周有熬夜/通宵，未补觉。'));
  ui.weekReport = {
    week: state.time.week,
    income: 425,
    util: utilPaid,
    kit: kitPaid,
    sleep: sleepGain,
    balance: p.money
  };
  ui.phase = 'weekly';
  ui.weeklySaved = null;
  saveGame();
  renderAll();
}

function continueWeekly() {
  if (state.time.week === 9) { showExam(); return; }
  state.time.week++;
  state.time.dayOfWeek = 1;
  const w = state.time.week;
  if (w <= 9 && !state.schedule.grid[w]) state.schedule.grid[w] = generateGrid();
  pushLog('第 ' + w + ' 周：系统随机生成本周课表。');
  saveGame();
  ui.phase = 'schedule';
  renderAll();
}

/* ---------- 崩溃 ---------- */
function triggerCollapse(resumePhase) {
  const p = state.player;
  p.isCollapsed = true;
  p.sanity = 0;
  state.stats.collapseCount++;
  pushLog('理智归零，进入崩溃状态：必须做出抉择。');
  ui.collapseResume = resumePhase;
  ui.phase = 'collapse';
  renderAll();
}

function resolveCollapse(kind) {
  const p = state.player;
  if (kind === 'skip') {
    p.restSkipDays = 3;
    p.skipMode = 'absent';
    p.skipClassNextDay = false;
    p.skipClassReason = null;
    MAJOR_IDS.forEach(function (id) { addProf(id, -3, { weeklyCap: false }); });
    p.sanity = clamp(p.sanity + 50, 0, 100);
    p.isCollapsed = false;
    pushLog('崩溃抉择：旷课 3 天。全科熟练度 -3，理智 +50（不消耗请假）。');
  } else {
    if (p.leaveCount <= 0) return;
    p.leaveCount--;
    p.restSkipDays = 2;
    p.skipMode = 'rest';
    p.sanity = clamp(p.sanity + 50, 0, 100);
    p.isCollapsed = false;
    pushLog('崩溃抉择：请假 2 天。消耗 1 次请假（剩余 ' + p.leaveCount + ' / 5），理智 +50。');
  }
  const resume = ui.collapseResume;
  ui.collapseResume = null;
  if (resume === 'finishDay') { finishDay(true); return; }
  if (resume === 'beginEvent') { beginEvent(); return; }
  if (resume === 'eventResult') { ui.phase = 'eventResult'; renderAll(); return; }
  if (resume === 'classEvent') { ui.phase = 'eventResult'; renderAll(); return; }
  if (resume === 'continueClass') { continueClassFlow(); return; }
  if (resume === 'finishClasses') { finishClasses(); return; }
  if (resume === 'freeTime') { ui.phase = 'freeTime'; renderAll(); return; }
  ui.phase = 'dayStart';
  renderAll();
}

/* ---------- 结束（阶段 4 扩展成绩明细） ---------- */
function gradeRank(g) {
  return ({ S: 7, A: 6, B: 5, C: 4, F: 3, D: 2 })[g] || 0;
}

function endGame(rating, reason, info) {
  if (ui.phase === 'ending') return;
  info = info || {};

  /* 撑过天数按日历计算：1-9 周每周 5 天，第 10 周补考 7 天 */
  function calendarDays() {
    const t = state.time;
    if (t.week === 10) return 45 + t.dayOfWeek;
    return (t.week - 1) * 5 + t.dayOfWeek;
  }

  record.attempts = (record.attempts || 0) + 1;
  if (!record.bestGrade || gradeRank(rating) > gradeRank(record.bestGrade)) record.bestGrade = rating;
  if (info.avg && info.avg > record.bestAvgScore) record.bestAvgScore = info.avg;
  if (state.player.runCount > record.bestRunCount) record.bestRunCount = state.player.runCount;
  record.clearedAt = Date.now();
  saveRecord();
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  ui.ending = {
    rating: rating,
    reason: reason,
    days: calendarDays(),
    info: info,
    runCount: state.player.runCount,
    collapseCount: state.stats.collapseCount || 0
  };
  ui.phase = 'ending';
  renderAll();
}

function goTitle() {
  ui.phase = 'title';
  renderAll();
}

/* ============================================================
   第 9 周期中考试 / 第 10 周补考 / 评级结算
   ============================================================ */
function calcExamScore(prof, sanity) {
  let r = random() * 100;
  if (sanity < 40) r = Math.max(0, r - 5);   // 文档 4.4：理智 <40 随机项 -5
  return Math.round(clamp(prof * 0.7 + r * 0.3, 0, 100));
}

function calcPassRate(prof) {
  const need = (60 - 0.7 * prof) / 0.3;
  return Math.round(clamp(100 - need, 0, 100));
}

function rateClass(rate) {
  return rate >= 80 ? 'green' : rate >= 50 ? 'gold' : 'red';
}

function examAvg(scores) {
  const ids = Object.keys(scores);
  if (!ids.length) return 0;
  let sum = 0;
  ids.forEach(function (id) { sum += scores[id]; });
  return Math.round(sum / ids.length);
}

function examMax(scores) {
  let m = 0;
  Object.keys(scores).forEach(function (id) { if (scores[id] > m) m = scores[id]; });
  return m;
}

function showExam() {
  state.exam.pending = true;
  state.exam.taken = false;
  ui.phase = 'exam';
  saveGame();
  renderAll();
}

function takeExam() {
  if (state.exam.taken) return;
  const p = state.player;
  const scores = {};
  const failed = [];
  MAJOR_IDS.forEach(function (id) {
    scores[id] = calcExamScore(state.courses[id].prof, p.sanity);
    if (scores[id] < 60) failed.push(id);
  });
  state.exam.taken = true;
  state.exam.pending = false;
  state.exam.scores = scores;
  state.exam.failed = failed;
  if (failed.length) {
    p.sanity = clamp(p.sanity - 20 * failed.length, 0, 100);
    pushLog('期中考试挂 ' + failed.length + ' 门，理智 -' + (20 * failed.length) + '。');
  } else {
    pushLog('期中考试 4 门全部及格。');
  }
  saveGame();
  ui.phase = 'examResult';
  renderAll();
}

function finishExamPass() {
  const scores = state.exam.scores;
  const avg = examAvg(scores);
  let all60 = true;
  MAJOR_IDS.forEach(function (id) {
    if (scores[id] < 60) all60 = false;
  });
  let rating = 'B';
  if (all60 && avg >= 85 && state.player.health >= 60) rating = 'S';
  else if (all60 && avg >= 75) rating = 'A';
  const label = { S: 'S · 学神', A: 'A · 稳过', B: 'B · 险过' }[rating];
  endGame(rating, label + ' · 期中通关', { scores: scores, avg: avg, max: examMax(scores) });
}

function startRetakeWeek() {
  const p = state.player;
  state.time.week = 10;
  state.time.dayOfWeek = 1;
  state.time.phase = 'retakeWeek';
  state.exam.enteredRetake = true;
  p.money += 425;                         // 补考周额外发放 1 次生活费
  if (p.money >= 100) p.money -= 100;     // 水电 60 + 资料 40
  else p.money = 0;
  p.studyKitThisWeek = true;
  p.gameCountThisWeek = 0;
  p.proxyCountThisWeek = 0;
  p.highIntensityDays = 0;
  state.weekly.hadLateNight = false;
  state.weekly.mealStreak = 0;
  state.weekly.gameProfGain = 0;
  MAJOR_IDS.forEach(function (id) { state.weekly.profGain[id] = 0; });
  ALL_IDS.forEach(function (id) { state.weekly.classCount[id] = 0; });
  pushLog('进入第 10 周补考周：不上课，每天 5 个自由格；生活费 +425，固定支出 -100。');
  ui.eventQueue = [];
  ui.phase = 'dayStart';
  saveGame();
  renderAll();
}

function showRetakeExam() {
  const p = state.player;
  const failed = (state.exam.failed || []).slice();
  const scores = {};
  const decayed = {};
  failed.forEach(function (id) {
    state.courses[id].prof = clamp(state.courses[id].prof - 10, 0, 100); // 遗忘惩罚
    decayed[id] = state.courses[id].prof;
    scores[id] = calcExamScore(state.courses[id].prof, p.sanity);
  });
  state.exam.retakeTaken = true;
  state.exam.retakeScores = scores;
  state.exam.retakeDecayed = decayed;
  saveGame();
  ui.phase = 'retakeResult';
  renderAll();
}

function finishRetake() {
  const allScores = Object.assign({}, state.exam.scores, state.exam.retakeScores);
  const stillFailed = (state.exam.failed || []).filter(function (id) {
    return state.exam.retakeScores[id] < 60;
  });
  if (stillFailed.length === 0) {
    endGame('C', 'C · 补考侠 · 补考通过', { scores: allScores, avg: examAvg(allScores), max: examMax(allScores) });
  } else {
    endGame('F', 'F · 退学 · 补考挂科', { scores: allScores, avg: examAvg(allScores), max: examMax(allScores) });
  }
}

/* ---------- 流程面板 ---------- */
function deltaText(n) { return (n > 0 ? '+' : '') + n; }

function chip(text, kind) {
  return '<i class="chip ' + (kind || '') + '">' + text + '</i>';
}

function effectSummary(eff) {
  if (!eff) return '';
  const parts = [];
  function num(label, v) {
    if (!v) return;
    parts.push(chip(label + deltaText(v), v > 0 ? 'up' : 'down'));
  }
  num('体', eff.stamina);
  num('命', eff.health);
  num('智', eff.sanity);
  num('游戏', eff.gameProf);
  num('¥', eff.money);
  if (eff.prof) {
    const pr = eff.prof;
    let name = '熟';
    if (pr.course === 'all_major') name = '全科熟';
    else if (pr.course === 'firstMajorToday') name = '首课熟';
    else if (pr.course === 'choose') name = '自选课熟';
    else if (COURSE_DEFS[pr.course]) name = COURSE_DEFS[pr.course].short + '熟';
    num(name, pr.delta);
  }
  num('校园跑', eff.runCount);
  num('请假', eff.leaveCount);
  num('次日体力上限', eff.maxStaminaNextDay);
  if (eff.flag) parts.push(chip('解锁社团', 'flag'));
  if (eff.skipToday) parts.push(chip('今日课程全翘', 'flag'));
  if (eff.skipRemaining) parts.push(chip('剩余课程全翘', 'flag'));
  if (eff.skipNextDay) parts.push(chip('次日课程全翘', 'flag'));
  return parts.length ? parts.join('') : chip('无数值变化', '');
}

function renderClassSession(c) {
  const d = state.day || {};
  const p = state.player;
  const plan = d.classPlan || [];
  const cur = plan[d.classIndex];
  const total = d.classTotal || plan.length || 0;
  const n = (d.classesRun || 0) + 1;
  let rows = '';
  (ui.classResults || []).forEach(function (r) {
    if (!r || r.skipped || r.free || r.exhaust) return;
    rows += '<div class="day-slot"><div class="t">' + SLOT_TIMES[r.slot] + '</div><div class="c">' +
      COURSE_DEFS[r.id].name + ' <span class="tag">体 -' + r.stamina +
      (r.gain ? ' · 熟 +' + r.gain : ' · 公共课') + '</span></div></div>';
  });
  if (!cur) {
    c.innerHTML = '<div class="panel"><h2>上课</h2><p class="dim">今天的课程已经结束。</p></div>';
    return;
  }
  let expect = 0, capNote = '';
  if (COURSE_DEFS[cur.id].type === 'major') {
    const wc = state.weekly.classCount[cur.id] || 0;
    const base = wc >= 5 ? 1 : 2;
    const roomW = 16 - (state.weekly.profGain[cur.id] || 0);
    const roomP = 100 - (state.courses[cur.id].prof || 0);
    expect = Math.max(0, Math.min(base, roomW, roomP));
    if (expect <= 0) capNote = '（本周 +16 或已到 100，熟练度不再增加）';
  }
  const head = total > 0
    ? '<span class="gold">第 ' + n + ' 节 / 共 ' + total + ' 节</span>'
    : '<span class="gold">第 ' + n + ' 节</span>';
  c.innerHTML =
    '<div class="panel">' +
    '<h2>' + dayText(state.time.week, state.time.dayOfWeek) + ' · 逐节上课</h2>' +
    '<div class="validate" style="margin:0 0 8px">' + head +
    '<span>剩余 ' + (d.classesRemaining || 0) + ' 节（含本节）</span>' +
    '<span>体力 ' + Math.round(p.stamina) + '</span><span>理智 ' + Math.round(p.sanity) + '</span>' +
    '<span>课间事件 ' + (d.classEventCount || 0) + ' / ' + CLASS_EVENT_DAILY_CAP + '</span>' +
    '</div>' +
    (rows ? '<div class="day-list" style="margin-bottom:10px">' + rows + '</div>' : '') +
    '<div class="day-list">' +
    '<div class="day-slot"><div class="t">' + SLOT_TIMES[cur.slot] + '</div><div class="c">' +
    COURSE_DEFS[cur.id].name + ' <span class="tag">' +
    (COURSE_DEFS[cur.id].type === 'major' ? '专业课 · 体力 -5 · 熟练度 +' + expect + capNote : '公共课 · 体力 -5') +
    '</span></div></div>' +
    '</div>' +
    '<div class="action-row"><button class="btn gold big" onclick="attendClass()">上这节课</button></div>' +
    '<details class="rules"><summary>？规则说明</summary><p class="hint">每节课后按 ' + Math.round(CLASS_EVENT_CHANCE * 100) + '% 概率触发课间事件，每天最多 ' +
    CLASS_EVENT_DAILY_CAP + ' 次；课间可消耗理智换体力，或选择翘掉剩余课程。</p></details>' +
    '</div>';
}

function renderClassRun(c) {
  const p = state.player;
  const res = ui.classResults || [];
  let rows = '';
  res.forEach(function (r) {
    if (r.skipped) {
      rows += '<div class="day-slot"><div class="c red">今天全部课程缺席（旷课）。</div></div>';
    } else if (r.free) {
      rows += '<div class="day-slot"><div class="c dim">补考周：今天不上课，5 个自由格全部可安排。</div></div>';
    } else if (r.exhaust) {
      rows += '<div class="day-slot"><div class="c red">体力归零，当场昏睡，剩余行动全部跳过。</div></div>';
    } else {
      rows += '<div class="day-slot"><div class="t">' + SLOT_TIMES[r.slot] + '</div><div class="c">' +
        COURSE_DEFS[r.id].name + ' <span class="tag">体力 -' + r.stamina +
        (r.gain ? ' · 熟练度 +' + r.gain : ' · 公共课') + '</span></div></div>';
    }
  });
  const nextLabel = state.day.exhausted ? '继续：餐饮结算' : '继续：今天的随机事件';
  const total = state.day.classTotal || state.day.classesRun || 0;
  c.innerHTML =
    '<div class="panel">' +

function reviewBlocked(courseId) {
  const d = state.day;
  if (d.freeSlotsLeft <= 0) return true;
  if ((d.reviewsByCourse[courseId] || 0) >= 2) return true;
  if (d.skippedCourses.indexOf(courseId) >= 0) return true;
  return effectiveReviewGain(courseId) <= 0;
}

/* 复习按钮不可用时的原因（避免静默失败） */
function reviewBlockedReason(courseId) {
  const d = state.day;
  if (!d) return '未在自由时间';
  if (d.freeSlotsLeft <= 0) return '无自由格';
  if ((d.reviewsByCourse[courseId] || 0) >= 2) return '本日已 2 格';
  if (d.skippedCourses.indexOf(courseId) >= 0) return '当天翘课';
  if (effectiveReviewGain(courseId) <= 0) return '本周已 +16';
  return '';
}

/* 夜间熬夜复习 / 通宵突击的该科实际可得熟练度（受 100 与单科周 +16 限制） */
function nightProfGain(courseId, base) {
  const c = state.courses[courseId];
  if (!c) return 0;
  let room = 99;
  if (state.time.week !== 10) room = 16 - (state.weekly.profGain[courseId] || 0);
  return Math.max(0, Math.min(base, room, 100 - (c.prof || 0)));
}

    '<p class="dim" style="font-size:12px">成绩 = 熟练度 × 70% + 随机(0-100) × 30%，≥60 及格；理智 &lt; 40 时随机项 -5。</p>' +
    '<div class="day-list">' + rows + '</div>' +
    '<div class="validate"><span>当前理智 ' + Math.round(p.sanity) + '</span>' +
    '<span>生命 ' + Math.round(p.health) + '</span>' +
    (lowCount ? '<span class="red">有 ' + lowCount + ' 门预估通过率 &lt; 60%，是否还有最后几天补复习？</span>' : '<span class="green">四门预估均可一搏</span>') +
    '</div>' +
    '<div class="action-row"><button class="btn gold big" onclick="takeExam()">开考</button></div>' +
    '</div>';
}

function renderExamResult(c) {
  const scores = state.exam.scores || {};
  const failed = state.exam.failed || [];
  let rows = '';
  MAJOR_IDS.forEach(function (id) {
    const s = scores[id];
    const pass = s >= 60;
    rows += '<div class="day-slot"><div class="t">' + COURSE_DEFS[id].short + '</div>' +
      '<div class="c">' + state.courses[id].name + ' <span class="' + (pass ? 'green' : 'red') + '">' +
      s + ' 分 · ' + (pass ? '及格' : '挂科') + '</span></div></div>';
  });
  const avg = examAvg(scores);
  c.innerHTML =
    '<div class="panel">' +
    '<h2>期中成绩</h2>' +
    '<div class="day-list">' + rows + '</div>' +
    '<div class="validate"><span>平均 ' + avg + ' 分</span><span>最高 ' + examMax(scores) + ' 分</span>' +
    '<span class="' + (failed.length ? 'red' : 'green') + '">' + (failed.length ? '挂科 ' + failed.length + ' 门' : '四门全过') + '</span></div>' +
    (failed.length ? '<p class="hint">挂科每门理智 -20；已进入第 10 周补考周（7 天、复习收益 +6/+4/+2/+1、补考熟练度先 -10）。</p>' :
      '<p class="hint">四门全部及格，进入通关结算。</p>') +
    '<div class="action-row"><button class="btn gold big" onclick="' +
    (failed.length ? 'startRetakeWeek()' : 'finishExamPass()') + '">' +
    (failed.length ? '进入第 10 周补考' : '查看结算') + '</button></div>' +
    '</div>';
}

function renderRetakeResult(c) {
  const scores = state.exam.retakeScores || {};
  const decayed = state.exam.retakeDecayed || {};
  let rows = '';
  let stillFailed = 0;
  (state.exam.failed || []).forEach(function (id) {
    const s = scores[id];
    const pass = s >= 60;
    if (!pass) stillFailed++;
    rows += '<div class="day-slot"><div class="t">' + COURSE_DEFS[id].short + '</div>' +
      '<div class="c">' + state.courses[id].name + ' · 补考熟练度 ' + Math.round(decayed[id] || 0) +
      ' <span class="' + (pass ? 'green' : 'red') + '">' + s + ' 分 · ' + (pass ? '通过' : '仍未及格') + '</span></div></div>';
  });
  c.innerHTML =
    '<div class="panel">' +
    '<h2>第 10 周 · 补考成绩</h2>' +
    '<div class="day-list">' + rows + '</div>' +
    '<div class="validate"><span class="' + (stillFailed ? 'red' : 'green') + '">' +
    (stillFailed ? '仍有 ' + stillFailed + ' 门不及格' : '补考全部通过') + '</span></div>' +
    '<p class="hint">' + (stillFailed ? '补考仅 1 次机会，挂科即游戏失败。' : '补考通过，进入结算。') + '</p>' +
    '<div class="action-row"><button class="btn gold big" onclick="finishRetake()">查看结算</button></div>' +
    '</div>';
}

function renderEnding(c) {
  const e = ui.ending;
  if (!e) { c.innerHTML = ''; return; }
  const info = e.info || {};
  let scoreRows = '';
  if (info.scores) {
    MAJOR_IDS.forEach(function (id) {
      const s = info.scores[id];
      if (s === undefined) return;
      scoreRows += '<div class="day-slot"><div class="t">' + COURSE_DEFS[id].short + '</div>' +
        '<div class="c">' + state.courses[id].name + ' <span class="' + (s >= 60 ? 'green' : 'red') + '">' + s + ' 分</span></div></div>';
    });
  }
  c.innerHTML =
    '<div class="panel" style="text-align:center">' +
    '<div style="font-size:40px;color:var(--gold);text-shadow:4px 4px 0 #000;margin:10px 0">' + e.rating + '</div>' +
    '<h2 style="border-bottom:none">' + e.reason + '</h2>' +
    '<div class="validate" style="justify-content:center">' +
    '<span>撑过 ' + e.days + ' 天</span>' +
    (info.avg !== undefined ? '<span>平均 ' + info.avg + ' 分</span>' : '') +
    (info.max !== undefined ? '<span>最高单科 ' + info.max + ' 分</span>' : '') +
    '<span>校园跑 ' + e.runCount + ' 次</span>' +
    '<span>崩溃 ' + e.collapseCount + ' 次</span>' +
    '</div>' +
    (scoreRows ? '<div class="day-list" style="margin-top:10px;text-align:left">' + scoreRows + '</div>' : '') +
    '<p class="hint" style="margin-top:10px">评级：S 学神 / A 稳过 / B 险过 / C 补考侠 / F 退学 / D 倒下</p>' +
    '<div class="action-row" style="justify-content:center;margin-top:12px">' +
    '<button class="btn gold" onclick="startNewGame()">再来一局</button>' +
    '<button class="btn" onclick="goTitle()">返回标题</button>' +
    '</div></div>';
}

/* ========= 开局 / 继续 ========= */
function startNewGame() {
  if (localStorage.getItem(SAVE_KEY)) {
    if (!confirm('已有进行中的存档，开始新游戏会覆盖它。确定继续？')) return;
  }
  record = loadRecord();
  const seed = Math.floor(Math.random() * 2147483647);
  initRng(seed);
  state = createState(seed);
  ui.ending = null;
  pushLog('开学第一天：你拖着行李箱站在宿舍楼下。');
  pushLog('生活费到账 ¥425，第 1 周课表由系统随机生成。');
  ui.phase = 'schedule';
  saveGame();
  renderAll();
}

function continueGame() {
  const s = loadGame();
  if (!s) { alert('没有找到可用的存档。'); ui.phase = 'title'; renderAll(); return; }
  state = s;
  initRuntime();
  initRng(state.meta.seed || 1);
  /* 按存档阶段恢复：周结算/考试等阶段若一律回 dayStart，会重复过同一天（周五会重复领生活费）。
     旧存档没有 phase 字段时回退到 dayStart；只恢复不依赖临时 UI 数据的阶段。 */
  const savedPhase = (state.meta && state.meta.phase) || 'dayStart';
  const restorable = ['schedule','dayStart','freeTime','night','weekly','dayEnd','exam','examResult','retakeResult'];
  ui.phase = restorable.indexOf(savedPhase) >= 0 ? savedPhase : 'dayStart';
  ui.weekReport = (state.meta && state.meta.weekReport) ? clone(state.meta.weekReport) : null;
  ui.daySummary = (state.meta && state.meta.daySummary) ? clone(state.meta.daySummary) : null;
  if (ui.phase === 'weekly' && !ui.weekReport) ui.phase = 'dayStart';
  if (ui.phase === 'dayEnd' && !ui.daySummary) ui.phase = 'dayStart';
  const ex = state.exam || {};
  if (ex.enteredRetake) {
    ui.phase = ex.retakeTaken ? 'retakeResult' : 'dayStart';
  } else if (ex.pending && !ex.taken) {
    ui.phase = 'exam';
  } else if (ex.taken) {
    ui.phase = 'examResult';
  }
  if (!state.day || typeof state.day.freeSlotsLeft !== 'number') {
    // 仅在旧存档缺少该字段时重算，避免读档重置已用完的自由格
    if (!state.day) state.day = {};
    const grid = state.time.week === 10 ? [null, null, null, null, null] : todayGrid();
    state.day.freeSlotsLeft = 5 - grid.filter(Boolean).length;
  }
  renderAll();
}

/* ========= 启动 ========= */
record = loadRecord();
renderAll();
</script>
</body>
</html>
