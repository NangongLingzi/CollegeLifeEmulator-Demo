<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大学生活模拟器 · Demo</title>
<style>
@import url("https://fontsapi.zeoseven.com/570/main/result.css");
  :root{
    --bg:#1B1B2F;
    --panel:#2A2A40;
    --line:#4A4A6A;
    --text:#E8E8F0;
    --dim:#8A8AA0;
    --gold:#F2C14E;
    --stam:#4ADE80;
    --hp:#F45B69;
    --san:#60A5FA;
    --game:#C084FC;
    --danger:#FF3B3B;
    --dark:#151525;
  }
  *{box-sizing:border-box;border-radius:0!important;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Fusion Pixel 12px Mono latin","Zpix","微软雅黑","Microsoft YaHei",monospace;
    font-size:15px;
    letter-spacing:0;
    -webkit-font-smoothing:auto;
    font-smooth:auto;
    image-rendering:pixelated;
    line-height:1.7;
  }
  #app{max-width:960px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
  /* ---------- 顶部状态条 ---------- */
  #topbar{
    border:2px solid var(--line);
    border-top:none;
    background:var(--panel);
    padding:8px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    min-height:80px;
  }
  .brand{color:var(--gold);font-size:16px;line-height:1.2;}
  .brand .ver{display:block;color:var(--dim);font-size:10px;letter-spacing:2px;}
  .clock{font-size:16px;color:var(--text);}
  .clock .wnum{color:var(--gold);}
  .stats{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .stat{min-width:120px;position:relative;transition:transform .1s steps(2);}
  .stat:hover{transform:translateY(-3px);}
  .stat:hover .head b{color:var(--gold);}
  .stat .tip,.money-chip .tip{
    position:absolute;bottom:calc(100% + 8px);left:50%;
    transform:translateX(-50%) translateY(4px);
    background:#000;color:var(--text);font-size:11px;line-height:1.6;white-space:nowrap;
    padding:6px 8px;opacity:0;pointer-events:none;z-index:30;
    transition:opacity .1s steps(2), transform .1s steps(2);
  }
  .stat .tip{border:2px solid var(--line);box-shadow:3px 3px 0 #000;}
  .stat:hover .tip{opacity:1;transform:translateX(-50%) translateY(0);}
  .stat .head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--dim);}
  .stat .head b{font-size:18px;font-weight:normal;color:var(--text);}
  .bar{display:flex;gap:1px;border:2px solid var(--line);background:var(--dark);padding:2px;height:16px;margin-top:2px;}
  .bar i{flex:1;background:#33334A;}
  .bar i.on.stam{background:var(--stam);}
  .bar i.on.hp{background:var(--hp);}
  .bar i.on.san{background:var(--san);}
  .bar i.on.game{background:var(--game);}
  .bar i.on.money{background:var(--gold);}
  .bar.danger{border-color:var(--danger);animation:blink 1s steps(2,start) infinite;}
  .money-chip{display:inline-block;position:relative;margin-left:6px;color:var(--gold);font-size:15px;border:2px solid var(--gold);padding:2px 8px;vertical-align:middle;transition:transform .1s steps(2);}
  .money-chip:hover{transform:translateY(-2px);}
  .money-chip .tip{border:2px solid var(--gold);box-shadow:3px 3px 0 #000;}
  .money-chip:hover .tip{opacity:1;transform:translateX(-50%) translateY(0);}
  @keyframes blink{50%{opacity:.35;}}
  /* ---------- 主区 ---------- */
  main{display:grid;grid-template-columns:240px 1fr;gap:16px;padding:16px;flex:1;align-items:start;}
  #sidebar{display:flex;flex-direction:column;gap:12px;}
  .s-chart{width:100%;max-width:300px;margin:0 auto;}
  #center{min-height:440px;display:flex;flex-direction:column;gap:12px;}
  .panel{
    background:var(--panel);
    border:2px solid var(--line);
    padding:18px;
  }
  .panel h2{
    font-size:16px;font-weight:normal;color:var(--gold);
    margin-bottom:10px;padding-bottom:6px;
    border-bottom:2px solid var(--line);
  }
  .panel h3{font-size:14px;font-weight:normal;color:var(--text);margin:10px 0 6px;}
  .dim{color:var(--dim);}
  .gold{color:var(--gold);}
  .red{color:var(--hp);}
  .blue{color:var(--san);}
  .green{color:var(--stam);}
  .course-row{margin-bottom:9px;}
  .course-row .name{display:flex;justify-content:space-between;font-size:12px;}
  .course-row .name span:last-child{color:var(--gold);}
  .mini-bar{display:flex;gap:1px;border:2px solid var(--line);background:var(--dark);padding:1px;height:12px;margin-top:3px;}
  .mini-bar i{flex:1;background:#33334A;}
  .mini-bar i.on{background:var(--gold);}
  .side-info{border-top:2px solid var(--line);margin-top:8px;padding-top:8px;font-size:12px;line-height:1.9;}
  .side-info b{color:var(--gold);font-weight:normal;}
  /* ---------- 按钮 ---------- */
  .btn{
    display:inline-block;
    background:var(--panel);
    border:2px solid var(--line);
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    letter-spacing:1px;
    padding:7px 14px;
    cursor:pointer;
    box-shadow:3px 3px 0 #000;
    margin:3px 4px 3px 0;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold);}
  .btn:active{transform:translate(3px,3px);box-shadow:none;}
  .btn.gold{border-color:var(--gold);color:var(--gold);}
  .btn.big{font-size:16px;padding:10px 22px;}
  .btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
  .btn:disabled:hover{border-color:var(--line);color:var(--text);}
  .btn.small{font-size:12px;padding:4px 8px;}
  .btn.stack{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;}
  .btn.stack .eff{font-size:11px;color:var(--dim);letter-spacing:0;line-height:1.5;}
  .btn.opt{display:block;width:100%;text-align:left;}
  .opt-title{display:block;font-size:14px;color:var(--text);}
  .opt-eff{display:block;margin-top:6px;font-size:11px;color:var(--dim);letter-spacing:0;line-height:1.6;}
  .chip{display:inline-block;font-size:11px;padding:2px 6px;margin:2px 4px 2px 0;border:1px solid var(--line);color:var(--dim);}
  .chip.up{color:var(--stam);border-color:var(--stam);}
  .chip.down{color:var(--hp);border-color:var(--hp);}
  .chip.flag{color:var(--gold);border-color:var(--gold);}
  /* ---------- 标题页 ---------- */
  .title-screen{padding:40px 20px;text-align:center;}
  .title-screen .logo{
    font-size:32px;color:var(--gold);letter-spacing:6px;
    text-shadow:4px 4px 0 #000;margin-bottom:6px;
  }
  .title-screen .sub{color:var(--dim);font-size:12px;letter-spacing:2px;margin-bottom:26px;}
  .title-screen .menu{display:flex;flex-direction:column;gap:10px;align-items:center;}
  .title-screen .record{
    margin-top:26px;border-top:2px solid var(--line);padding-top:14px;
    color:var(--dim);font-size:12px;line-height:2;
  }
  /* 成就图鉴 */
  .ach-gallery{margin-top:28px;border-top:2px solid var(--line);padding-top:16px;text-align:left;}
  .ach-head{color:var(--gold);font-size:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
  .ach-count{color:var(--dim);font-size:12px;}
  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
  .ach-badge{border:2px solid var(--line);background:var(--dark);padding:8px 10px;min-height:58px;}
  .ach-badge b{display:block;font-size:13px;color:var(--text);line-height:1.4;}
  .ach-badge span{display:block;font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5;}
  .ach-badge.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
  .ach-badge.on b{color:var(--gold);}
  .ach-badge.locked{opacity:.6;}
  .ach-badge.locked b{color:var(--dim);}
  .ach-badge.hidden.on{border-color:var(--hp);}
  .ach-badge.hidden.on b{color:var(--hp);}
  /* 成就解锁提示 */
  #ach-toast{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
  .ach-toast{background:#000;border:2px solid var(--gold);box-shadow:4px 4px 0 #000;padding:8px 12px;min-width:170px;animation:achIn .22s steps(3) both;}
  .ach-toast.hidden{border-color:var(--hp);}
  .ach-toast-title{font-size:10px;color:var(--dim);letter-spacing:1px;}
  .ach-toast-name{font-size:15px;color:var(--gold);margin-top:4px;}
  .ach-toast.hidden .ach-toast-name{color:var(--hp);}
  @keyframes achIn{from{transform:translateX(24px);opacity:0;}to{transform:none;opacity:1;}}
  /* ---------- 课表 ---------- */
  .schedule-table{width:100%;border-collapse:collapse;margin-top:8px;}
  .schedule-table th,.schedule-table td{border:2px solid var(--line);padding:2px;text-align:center;}
  .schedule-table th{background:var(--dark);color:var(--dim);font-size:12px;font-weight:normal;height:26px;}
  .schedule-table td.time{background:var(--dark);color:var(--dim);font-size:12px;width:58px;}
  .cell{
    width:100%;height:34px;background:transparent;border:none;
    color:var(--text);font-family:inherit;font-size:12px;letter-spacing:1px;
  }
  .cell.filled{background:var(--dark);color:var(--gold);}
  .validate{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:10px;color:var(--dim);}
  .validate .ok{color:var(--stam);}
  .validate .bad{color:var(--hp);}
  .hint{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.8;}
  .rules{margin-top:8px;border:2px solid var(--line);background:var(--dark);padding:6px 10px;}
  .rules summary{cursor:pointer;color:var(--dim);font-size:12px;list-style:none;user-select:none;}
  .rules summary::before{content:'▶ ';color:var(--gold);}
  .rules[open] summary::before{content:'▼ ';}
  .rules p{margin-top:6px;}
  .save-point{margin-top:12px;border:2px dashed var(--gold);padding:10px 12px;}
  .save-q{font-size:13px;color:var(--gold);margin-bottom:8px;}
  .save-note{font-size:12px;margin-top:8px;line-height:1.6;min-height:16px;}
  /* ---------- 日面板 ---------- */
  .day-list{border:2px solid var(--line);}
  .day-slot{display:flex;border-bottom:2px solid var(--line);font-size:13px;min-height:36px;align-items:center;}
  .day-slot:last-child{border-bottom:none;}
  .day-slot .t{width:64px;color:var(--dim);font-size:12px;text-align:center;border-right:2px solid var(--line);align-self:stretch;display:flex;align-items:center;justify-content:center;}
  .day-slot .c{flex:1;padding:0 10px;}
  .day-slot .c.free{color:var(--dim);}
  .day-slot .tag{font-size:10px;color:var(--dim);}
  .action-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .action-row .btn{margin:0;flex:0 0 auto;}
  /* ---------- 日志 ---------- */
  #logbar{
    background:#000;
    border:2px solid #3a3a3a;
    margin-top:0;
    flex:0 0 auto;
  }
  .cmd-title{
    display:flex;align-items:center;gap:8px;
    background:#1a1a1a;color:#d8d8d8;
    border-bottom:1px solid #333;
    padding:4px 10px;font-size:12px;letter-spacing:1px;
    user-select:none;
  }
  .cmd-dot{color:var(--stam);}
  .cmd-btns{margin-left:auto;display:flex;gap:6px;}
  .cmd-btns i{font-style:normal;width:18px;height:18px;line-height:18px;text-align:center;background:#2a2a2a;border:1px solid #444;color:#9a9a9a;font-size:11px;cursor:default;}
  .cmd-btns i.close{background:#4a1515;color:#ff9a9a;border-color:#6a2a2a;}
  #loglist{
    font-size:12px;color:#c8c8c8;
    padding:6px 10px;min-height:64px;max-height:96px;overflow-y:auto;
  }
  #loglist div{line-height:1.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #loglist .prompt{color:var(--stam);margin-right:4px;}
  #loglist .dim{color:#8a8a8a;}
  #loglist::after{content:'▌';color:var(--stam);animation:blink 1s steps(1) infinite;}
  body.title-mode #sidebar,body.title-mode #logbar{display:none;}
  body.title-mode main{grid-template-columns:1fr;}
  /* ---------- 响应式 ---------- */
  @media (max-width:720px){
    #topbar{flex-wrap:wrap;}
    .stats{flex:1 1 100%;}
    main{display:flex;flex-direction:column;align-items:stretch;}
    #center{order:-1;min-width:0;width:100%;}
    #sidebar{flex-direction:row;flex-wrap:wrap;width:100%;}
    #sidebar .panel{flex:1 1 100%;}
    .stat{min-width:104px;}
    .title-screen .logo{font-size:24px;letter-spacing:3px;}
  }
  @media (max-width:480px){
    html,body{height:auto;min-height:100%;}
    body{overflow-x:hidden;}
    #topbar{position:sticky;top:0;z-index:20;padding:6px 8px;gap:6px;min-height:64px;}
    .brand{font-size:14px;}
    .brand .ver{font-size:9px;letter-spacing:1px;}
    .clock{font-size:14px;}
    .stats{gap:6px;width:100%;flex-wrap:nowrap;}
    .stat{flex:1 1 0;min-width:0;}
    .stat .head{font-size:10px;}
    .stat .head b{font-size:14px;}
    .bar{height:12px;}
    .money-chip{font-size:13px;padding:2px 6px;margin-left:4px;}
    main{padding:6px;gap:8px;}
    #center{min-height:0;}
    #logbar{flex:0 0 auto;}
    .panel{padding:10px;}
    .panel h2{font-size:15px;}
    .action-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px;}
    .action-row .btn{width:100%;margin:0;}
    .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:8px 10px;
      font-size:13px;white-space:normal;word-break:break-word;line-height:1.45;}
    .btn.small{min-height:44px;font-size:12px;padding:8px;letter-spacing:0;}
    .btn.stack{padding:8px 10px;}
    .btn.stack .eff{font-size:12px;line-height:1.5;}
    .action-row[style*="column"]{grid-template-columns:1fr;}
    .action-row[style*="column"] .btn{justify-content:flex-start;text-align:left;}
    .night-block{flex-wrap:wrap;align-items:stretch;}
    .night-block .c,.night-block .action-row{flex:1 1 100%;}
    .day-slot{min-height:44px;}
    .day-slot .c{padding:6px 10px;white-space:normal;word-break:break-word;}
    .day-slot .t{width:52px;}
    #loglist div{white-space:normal;overflow:visible;text-overflow:clip;}
    .schedule-table th,.schedule-table td{padding:1px;}
    .schedule-table td.time{width:40px;font-size:11px;}
    .cell{font-size:11px;height:38px;letter-spacing:0;}
    .validate{gap:8px;line-height:1.6;}
  }
  @media (prefers-reduced-motion: reduce){
    .bar.danger,#loglist::after,.ach-toast{animation:none!important;}
    .stat,.stat .tip,.money-chip,.money-chip .tip,.ach-toast,.btn{transition:none!important;}
    .btn:active{transform:none!important;}
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">大学生活模拟器<span class="ver">DEMO v0.1 · 像素生存</span></div>
    <div id="clock" class="clock">未开始</div>
    <div id="stats" class="stats"></div>
  </header>
  <main>
    <aside id="sidebar">
      <div class="panel">
        <h2>课程熟练度</h2>
        <div id="chart-radar" class="s-chart" style="height:180px"></div>
        <div class="side-info" id="side-info"></div>
      </div>
      <div class="panel">
        <h2>理智值</h2>
        <div id="chart-sanity" class="s-chart" style="height:190px"></div>
      </div>
    </aside>
    <section id="center">
      <div id="center-body"></div>
      <footer id="logbar">
        <div class="cmd-title">
          <span class="cmd-dot">▶</span><span class="cmd-name">系统日志 · SYSLOG</span>
          <span class="cmd-btns"><i class="min">—</i><i class="max">□</i><i class="close">✕</i></span>
        </div>
        <div id="loglist" role="log" aria-live="polite" aria-label="系统日志"></div>
      </footer>
    </section>
  </main>
</div>

<div id="ach-toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   大学生活模拟器 Demo
   单文件 / 原生 JS / 无外部依赖
   数据依据：大学生活模拟器-项目说明.md
   ============================================================ */

/* ========= 常量 ========= */
const SAVE_KEY = 'dslr_save_v1';
const RECORD_KEY = 'dslr_record_v1';

const COURSE_DEFS = {
  java:     { name: 'Java',         short: 'Java',    type: 'major',  weeklySlots: 3 },
  web:      { name: '前端开发',      short: '前端',    type: 'major',  weeklySlots: 3 },
  db:       { name: '数据库',        short: '数据库',  type: 'major',  weeklySlots: 2 },
  android:  { name: 'Android 开发',  short: 'Android', type: 'major',  weeklySlots: 2 },
  politics: { name: '政治',          short: '政治',    type: 'public', weeklySlots: 1 },
  startup:  { name: '大学生创业指导', short: '创业',    type: 'public', weeklySlots: 1 },
  pe:       { name: '体育',          short: '体育',    type: 'public', weeklySlots: 1 }
};
const MAJOR_IDS = ['java', 'web', 'db', 'android'];
const PUBLIC_IDS = ['politics', 'startup', 'pe'];
const ALL_IDS = Object.keys(COURSE_DEFS);
const SLOT_TIMES = ['08:00', '10:00', '14:00', '16:00', '19:00'];
const DAY_NAMES = ['', '周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const MEAL_DEFS = [
  { id: 'breakfast', name: '早餐', price: 10 },
  { id: 'lunch',     name: '午餐', price: 18 },
  { id: 'dinner',    name: '晚餐', price: 18 }
];
const CYCLE_COURSES = [null, 'java', 'web', 'db', 'android', 'politics', 'startup', 'pe'];

/* ========= 全局状态 ========= */
let state = null;
let record = { bestGrade: null, bestAvgScore: 0, bestRunCount: 0, clearedAt: 0, attempts: 0 };
let ui = { phase: 'title' };

/* ========= 成就系统 ========= */
const ACH_KEY = 'dslr_ach_v1';
const ACHIEVEMENTS = [
  { id:'hexagon',    name:'六边形战士',      desc:'四门专业课熟练度全部达到 100',      check:function(){ return MAJOR_IDS.every(function(id){ return (state.courses[id].prof||0) >= 100; }); } },
  { id:'retake_hero',name:'补考侠',          desc:'进入补考周并全部通过',             check:function(){ return ui.ending && ui.ending.rating === 'C'; } },
  { id:'sacrifice',  name:'壮烈牺牲',        desc:'生命归零',                         check:function(){ return ui.ending && ui.ending.rating === 'D'; } },
  { id:'survivor',   name:'耐活王',          desc:'顺利通关一次（期中直接全过）',     check:function(){ return ui.ending && ['S','A','B'].indexOf(ui.ending.rating) >= 0; } },
  { id:'faint',      name:'累到晕厥',        desc:'体力归零昏睡',                     check:function(){ return !!state.flags.fainted; } },
  { id:'collapse',   name:'404无响应',       desc:'理智归零崩溃 1 次',                check:function(){ return (state.stats.collapseCount||0) >= 1; } },
  { id:'phoenix',    name:'不死鸟',          desc:'崩溃 2 次还活着',                  check:function(){ return (state.stats.collapseCount||0) >= 2; } },
  { id:'work_king',  name:'打工皇帝',        desc:'累计兼职收入 ≥ 1200',              check:function(){ return (state.runStats.workIncome||0) >= 1200; } },
  { id:'penniless',  name:'一贫如洗',        desc:'金钱归零',                         check:function(){ return state.player.money === 0; } },
  { id:'tycoon',     name:'大富翁',          desc:'存款 ≥ 2000',                      check:function(){ return state.player.money >= 2000; } },
  { id:'gamer',      name:'头号玩家',        desc:'游戏熟练度 = 100',                 check:function(){ return (state.player.gameProf||0) >= 100; } },
  { id:'sunny',      name:'阳光开朗大男孩',  desc:'整局理智从未低于 20 并通关',       check:function(){ return ui.ending && ui.ending.rating !== 'D' && !state.flags.sanityBelow20; } },
  { id:'rooftop',    name:'天台的风',        desc:'触发天台事件（E24）',              hidden:true, check:function(){ return !!state.flags.e24_seen; } },
  { id:'immortal',   name:'修仙',            desc:'连续 3 天不吃早餐',                hidden:true, check:function(){ return (state.runStats.breakfastSkipStreak||0) >= 3; } },
  { id:'keyboard',   name:'键来',            desc:'连续 3 天通宵复习',                hidden:true, check:function(){ return (state.runStats.allNightStreak||0) >= 3; } }
];

let achievements = loadAchievements();

function loadAchievements(){
  try {
    const raw = localStorage.getItem(ACH_KEY);
    if (!raw) return new Set();
    return new Set(JSON.parse(raw) || []);
  } catch (e) { return new Set(); }
}

function saveAchievements(){
  try { localStorage.setItem(ACH_KEY, JSON.stringify(Array.from(achievements))); } catch (e) {}
}

function getAchievement(id){
  for (let i = 0; i < ACHIEVEMENTS.length; i++) if (ACHIEVEMENTS[i].id === id) return ACHIEVEMENTS[i];
  return null;
}

function unlockAchievement(id){
  if (achievements.has(id)) return;
  achievements.add(id);
  saveAchievements();
  toastAchievement(getAchievement(id));
}

function toastAchievement(a){
  if (!a) return;
  const box = document.getElementById('ach-toast');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'ach-toast' + (a.hidden ? ' hidden' : '');
  el.innerHTML = '<div class="ach-toast-title">🏆 成就解锁</div><div class="ach-toast-name">' + a.name + '</div>';
  box.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 4200);
}

function checkAchievements(){
  if (!state) return;
  if (!state.stats) state.stats = { collapseCount: 0 };
  if (!state.runStats) state.runStats = { workIncome: 0, breakfastSkipStreak: 0, allNightStreak: 0 };
  if (typeof state.player.sanity === 'number' && state.player.sanity < 20) state.flags.sanityBelow20 = true;
  for (let i = 0; i < ACHIEVEMENTS.length; i++) {
    const a = ACHIEVEMENTS[i];
    if (achievements.has(a.id)) continue;
    try { if (a.check && a.check()) unlockAchievement(a.id); } catch (e) {}
  }
}

function achGalleryHTML(){
  const total = ACHIEVEMENTS.length;
  let unlockedCount = 0;
  let items = '';
  for (let i = 0; i < ACHIEVEMENTS.length; i++) {
    const a = ACHIEVEMENTS[i];
    const on = achievements.has(a.id);
    if (on) unlockedCount++;
    const cls = 'ach-badge' + (on ? ' on' : ' locked') + (a.hidden ? ' hidden' : '');
    let name = a.name, desc = a.desc;
    if (a.hidden && !on) { name = '？？？'; desc = '隐藏成就'; }
    else if (!on) { desc = '未解锁'; }
    items += '<div class="' + cls + '"><b>' + (on ? '✓ ' : '') + name + '</b><span>' + desc + '</span></div>';
  }
  return '<div class="ach-gallery">' +
    '<div class="ach-head">🏆 成就图鉴 <span class="ach-count">' + unlockedCount + ' / ' + total + '</span></div>' +
    '<div class="ach-grid">' + items + '</div></div>';
}

/* ========= 工具 ========= */
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function $(id) { return document.getElementById(id); }
function dayText(week, day) {
  if (week === 10) return '补考周 · 第 ' + day + ' 天';
  return '第 ' + week + ' 周 · ' + (DAY_NAMES[day] || ('第' + day + '天'));
}

/* ========= 带种子随机（mulberry32） ========= */
let rngState = 1;
function initRng(seed) { rngState = (seed >>> 0) || 1; }
function random() {
  rngState = (rngState + 0x6D2B79F5) >>> 0;
  let t = rngState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function CH(p, failEffects, failText, replace) {

/* ========= 默认课表 =========
   周一 2 门主课 + 政治 / 周二 2 门主课 / 周三 2 门主课 + 创业
   周四 2 门主课 / 周五 2 门主课 + 体育
   专业课 3/3/2/2（共 10 节）+ 公共课 3 节 = 13 节，自由槽 12 个
   数据维度：[天(0-4)][槽(0-4)]
*/
function defaultGrid() {
  return [
    ['java', 'java', 'politics', null, null],
    ['web', 'web', null, null, null],
    ['db', 'db', 'startup', null, null],
    ['android', 'android', null, null, null],
    ['java', 'web', 'pe', null, null]
  ];
}

/* ========= 系统随机排课 =========
   硬约束：专业课 ≥10 节 / 每天 ≥1 节专业课 / 3 门公共课各 ≥1 节
   生成 10 专业课 + 3 公共课 = 13 节；失败有限重试，最终回退到合法默认课表。
*/
function isValidGrid(grid) {
  let majorTotal = 0;
  const pubCount = { politics: 0, startup: 0, pe: 0 };
  for (let d = 0; d < 5; d++) {
    let majorToday = 0;
    for (let s = 0; s < 5; s++) {
      const id = grid[d][s];
      if (!id) continue;
      if (COURSE_DEFS[id].type === 'major') { majorTotal++; majorToday++; }
      else if (pubCount[id] !== undefined) pubCount[id]++;
    }
    if (majorToday < 1) return false;
  }
  if (majorTotal < 10) return false;
  if (pubCount.politics < 1 || pubCount.startup < 1 || pubCount.pe < 1) return false;
  return true;
}

function generateGrid() {
  for (let attempt = 0; attempt < 300; attempt++) {
    const grid = [[null, null, null, null, null], [null, null, null, null, null], [null, null, null, null, null], [null, null, null, null, null], [null, null, null, null, null]];
    /* 每天先保底 1 门专业课，再把 5 个额外专业课随机分配，单日最多 3 门 */
    const majorCounts = [1, 1, 1, 1, 1];
    for (let i = 0; i < 5; i++) {
      const candidates = [0, 1, 2, 3, 4].filter(function (d) { return majorCounts[d] < 3; });
      const d = candidates[Math.floor(random() * candidates.length)];
      majorCounts[d]++;
    }
    /* 三门公共课各自随机塞进还有空位的某一天 */
    const pubs = ['politics', 'startup', 'pe'];
    const pubDay = {};
    for (const id of pubs) {
      const candidates = [0, 1, 2, 3, 4].filter(function (d) { return majorCounts[d] + 1 <= 5; });
      if (!candidates.length) break;
      pubDay[id] = candidates[Math.floor(random() * candidates.length)];
    }
    if (Object.keys(pubDay).length !== 3) continue;
    /* 填充课程并打乱每天槽位 */
    const majors = MAJOR_IDS.slice();
    const cells = [];
    for (let d = 0; d < 5; d++) {
      for (let i = 0; i < majorCounts[d]; i++) cells.push({ d, id: majors[Math.floor(random() * majors.length)] });
    }
    pubs.forEach(function (id) { cells.push({ d: pubDay[id], id: id }); });
    cells.sort(function () { return random() - 0.5; });
    for (const c of cells) {
      for (let s = 0; s < 5; s++) {
        if (!grid[c.d][s]) { grid[c.d][s] = c.id; break; }
      }
    }
    if (isValidGrid(grid)) return grid;
  }
  return defaultGrid();
}

/* ========= 状态构造 ========= */
function createState(seed) {
  const courses = {};
  ALL_IDS.forEach(function (id) {
    courses[id] = {
      name: COURSE_DEFS[id].name,
      type: COURSE_DEFS[id].type,
      prof: 0,
      weeklySlots: COURSE_DEFS[id].weeklySlots
    };
  });
  const grid = {};
  grid[1] = generateGrid();

  return {
    meta: {
      version: 'demo-0.1',
      seed: seed,
      startedAt: Date.now(),
      turnIndex: 0
    },
    time: {
      week: 1,
      dayOfWeek: 1,
      phase: 'day',
      isExamWeek: false
    },
    player: {
      stamina: 100,
      health: 100,
      sanity: 100,
      gameProf: 0,
      money: 425,
      leaveCount: 5,
      runCount: 0,
      highIntensityDays: 0,
      gameCountThisWeek: 0,
      proxyCountThisWeek: 0,
      studyKitThisWeek: true,
      isCollapsed: false,
      maxStaminaNextDay: 0,
      skipClassNextDay: false,
      restSkipDays: 0
    },
    courses: courses,
    schedule: { grid: grid },
    log: [],
    flags: {},
    weekly: initWeekly(),

    exam: { pending: false, taken: false, scores: {}, failed: [], retakeTaken: false, retakeScores: {}, enteredRetake: false },

function initWeekly() {
  const gain = {}, count = {};
  ALL_IDS.forEach(function (id) { gain[id] = 0; count[id] = 0; });
  return {
    profGain: gain,
    classCount: count,
    gameProfGain: 0,
    hadLateNight: false,
    mealStreak: 0
  };
}

function initDay() {
  return {
    classesRun: 0,
    classesRemaining: 0,   /* 当天仍未上的课节数：课间/事件阶段据此判断是否还能「翘课」 */
    classPlan: [],         /* 当天待上的课：{slot, id}，逐节推进 */
    classIndex: 0,         /* 下一节要上的下标 */
    classTotal: 0,         /* 当天总节数 */
    classEventCount: 0,    /* 当天已触发的课间事件数 */
    classEventIds: [],     /* 当天已触发过的课间事件 id，避免同一天重复 */
    lowStaminaClasses: 0,  /* 体力 <50 时上课的节数，用于额外理智结算 */
    classesFinished: false,/* 当天课程是否已全部结算完毕 */
    freeSlotsLeft: 0,
    reviewsByCourse: {},
    runToday: 0,
    skippedCourses: [],
    mealsEaten: 0,
    missedMeals: 0,
    ateAll: false,
    hadLate: false,
    exhausted: false,
    eventDone: false,
    eventCount: 0
  };
}

function initRuntime() {
  if (!state.weekly) state.weekly = initWeekly();
  if (!state.day) state.day = initDay();
  if (!state.stats) state.stats = { collapseCount: 0 };
  if (!state.runStats) state.runStats = { workIncome: 0, breakfastSkipStreak: 0, allNightStreak: 0 };
  if (!state.exam) state.exam = { taken: false, scores: {}, failed: [], retakeTaken: false, retakeScores: {} };
  if (!state.eventState) state.eventState = { lastTrigger: {}, turnsSinceRare: 0 };
  if (!state.flags) state.flags = {};
  if (!state.courses) state.courses = {};
  /* 旧存档字段补全（dslr_save_v1 不含逐节上课字段时仍可继续） */
  const d = state.day;
  if (!Array.isArray(d.classPlan)) d.classPlan = [];
  if (typeof d.classIndex !== 'number') d.classIndex = 0;
  if (typeof d.classTotal !== 'number') d.classTotal = 0;
  if (typeof d.classEventCount !== 'number') d.classEventCount = 0;
  if (!Array.isArray(d.classEventIds)) d.classEventIds = [];
  if (typeof d.lowStaminaClasses !== 'number') d.lowStaminaClasses = 0;
  if (typeof d.classesFinished !== 'boolean') d.classesFinished = false;
  if (typeof d.classesRemaining !== 'number') d.classesRemaining = 0;
  if (typeof d.classesRun !== 'number') d.classesRun = 0;
  const p = state.player;
  if (p.maxStaminaNextDay === undefined) p.maxStaminaNextDay = 0;
  if (p.skipClassNextDay === undefined) p.skipClassNextDay = false;
  if (p.restSkipDays === undefined) p.restSkipDays = 0;
  if (p.skipMode === undefined) p.skipMode = null;
  if (p.gameCountThisWeek === undefined) p.gameCountThisWeek = 0;
  if (p.gameProf === undefined) p.gameProf = 0;
  if (p.proxyCountThisWeek === undefined) p.proxyCountThisWeek = 0;
  if (state.weekly.gameProfGain === undefined) state.weekly.gameProfGain = 0;
  if (!state.schedule || !state.schedule.grid) {
    state.schedule = { grid: {} };
  }
  if (!state.schedule.grid[state.time.week] && state.time.week <= 9) {
    state.schedule.grid[state.time.week] = generateGrid();
  }
}

/* ========= 存档 ========= */
function saveGame() {
  if (!state) return;
  try {
    if (!state.meta) state.meta = {};
    state.meta.phase = ui.phase;
    state.meta.weekReport = (ui.phase === 'weekly' && ui.weekReport) ? clone(ui.weekReport) : null;
    state.meta.daySummary = (ui.phase === 'dayEnd' && ui.daySummary) ? clone(ui.daySummary) : null;
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  } catch (e) { /* 存档失败不阻塞游戏 */ }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.meta || !s.player) return null;
    return s;
  } catch (e) {
    try { localStorage.removeItem(SAVE_KEY); } catch (e2) {}
    return null;
  }
}

function loadRecord() {
  try {
    const raw = localStorage.getItem(RECORD_KEY);
    if (!raw) return { bestGrade: null, bestAvgScore: 0, bestRunCount: 0, clearedAt: 0, attempts: 0 };
    const r = JSON.parse(raw);
    return {
      bestGrade: r.bestGrade || null,
      bestAvgScore: r.bestAvgScore || 0,
      bestRunCount: r.bestRunCount || 0,
      clearedAt: r.clearedAt || 0,
      attempts: r.attempts || 0
    };
  } catch (e) {
    return { bestGrade: null, bestAvgScore: 0, bestRunCount: 0, clearedAt: 0, attempts: 0 };
  }
}

/* #center-body 整块重渲染会丢掉焦点：若焦点落回 body，则还给主操作按钮 */
function refocusPrimaryAction() {
  const c = $('center-body');
  if (!c) return;
  const active = document.activeElement;
  if (active && active !== document.body && !c.contains(active)) return;
  const btn = c.querySelector('.action-row .btn:not([disabled])') || c.querySelector('.btn:not([disabled])');
  if (!btn) return;
  try { btn.focus({ preventScroll: true }); } catch (e) { btn.focus(); }
}

function barHTML(value, cls, dangerAt) {
  const v = Number.isFinite(Number(value)) ? Number(value) : 0;
  let cells = '';
  const filled = Math.round(clamp(v, 0, 100) / 5);
  for (let i = 0; i < 20; i++) {
    cells += '<i class="' + (i < filled ? 'on ' + cls : '') + '"></i>';
  }
  const danger = dangerAt !== undefined && v <= dangerAt;
  return '<div class="bar' + (danger ? ' danger' : '') + '">' + cells + '</div>';
}

function renderTop() {
  const clock = $('clock');
  const stats = $('stats');
  if (!state || ui.phase === 'title') {
    clock.textContent = '— 未开始 —';
    stats.innerHTML = '';
    return;
  }
  const t = state.time;
  const p = state.player;
  clock.innerHTML = '<span class="wnum">' + (t.week === 10 ? '第10周 · 补考' : '第' + t.week + '周') +
    '</span> · ' + (DAY_NAMES[t.dayOfWeek] || ('第' + t.dayOfWeek + '天')) +
    ' <span class="money-chip">¥' + p.money + '<span class="tip">金钱 ¥' + p.money + '</span></span>';

  stats.innerHTML =
    statHTML('体力', p.stamina, 'stam', true) +
    statHTML('生命', p.health, 'hp', true) +
    statHTML('理智', p.sanity, 'san', true) +
    statHTML('游戏熟练', p.gameProf || 0, 'game', true);
}

function statStatus(value) {
  if (value >= 70) return '良好';
  if (value >= 40) return '正常';
  if (value >= 20) return '偏低';
  return '危险';
}

function statHTML(label, value, cls, isPercent) {
  const v = Number.isFinite(Number(value)) ? Number(value) : 0;
  const shown = isPercent ? Math.round(v) : v;
  const tip = isPercent
    ? label + ' ' + shown + ' / 100 · ' + statStatus(v)
    : label + ' ' + shown;
  return '<div class="stat"><div class="head"><span>' + label + '</span><b class="' +
    (v <= 20 && isPercent ? 'red' : '') + '">' + shown + '</b></div>' +
    barHTML(v, cls, isPercent ? 20 : undefined) +
    '<span class="tip">' + tip + '</span></div>';
}

function miniBar(value) {
  let out = '';
  const filled = Math.round(clamp(value, 0, 100) / 5);
  for (let i = 0; i < 20; i++) out += '<i class="' + (i < filled ? 'on' : '') + '"></i>';
  return '<div class="mini-bar">' + out + '</div>';
}

function renderSidebar() {

/* ---------- 侧栏图表：原生 Canvas 绘制（不依赖外部 CDN） ---------- */
const CHART_FONT = '11px "Fusion Pixel 12px Mono latin","Zpix","微软雅黑",monospace';
let chartRaf = 0;

function chartCtx(el) {
  if (!el || !el.clientWidth || !el.clientHeight) return null;
  const w = el.clientWidth, h = el.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  let cv = el.querySelector('canvas');
  if (!cv) {
    cv = document.createElement('canvas');
    cv.style.display = 'block';
    cv.style.width = '100%';
    cv.style.height = '100%';
    el.innerHTML = '';
    el.appendChild(cv);
  }
  const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
  const ctx = cv.getContext('2d');
  if (!ctx) return null;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}

function updateRadarChart() {
  const env = chartCtx($('chart-radar'));
  if (!env) return;
  const ctx = env.ctx, w = env.w, h = env.h;
  const cx = w / 2, cy = h / 2;
  const angles = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
  const vals = MAJOR_IDS.map(function (id) { return clamp(Math.round(state.courses[id].prof || 0), 0, 100); });
  const names = MAJOR_IDS.map(function (id) { return COURSE_DEFS[id].short; });
  ctx.font = CHART_FONT;
  const maxLabelW = Math.max.apply(null, names.map(function (n) { return ctx.measureText(n).width; }));
  /* 侧栏窄到 200px 时，轴标签必须收进容器内，否则左侧文字会被裁掉 */
  const R = Math.max(28, Math.min(Math.min(w, h) * 0.31, w / 2 - maxLabelW - 14, h / 2 - 16));
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#3b3b5e';
  for (let ring = 1; ring <= 4; ring++) {
    ctx.beginPath();
    angles.forEach(function (a, i) {
      const x = cx + Math.cos(a) * R * ring / 4;
      const y = cy + Math.sin(a) * R * ring / 4;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.stroke();
  }
  angles.forEach(function (a) {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    ctx.stroke();
  });
  ctx.beginPath();
  vals.forEach(function (v, i) {
    const a = angles[i], r = R * v / 100;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(96,165,250,.30)';
  ctx.fill();
  ctx.strokeStyle = '#60a5fa';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#e9e9f4';
  ctx.font = CHART_FONT;
  ctx.textBaseline = 'middle';
  names.forEach(function (name, i) {
    const a = angles[i];
    const x = cx + Math.cos(a) * (R + 16);
    const y = cy + Math.sin(a) * (R + 16);
    ctx.textAlign = Math.abs(Math.cos(a)) < 0.3 ? 'center' : (Math.cos(a) > 0 ? 'left' : 'right');
    ctx.fillText(name, x, y);
  });
}

function updateSanityChart() {
  const env = chartCtx($('chart-sanity'));
  if (!env) return;
  const ctx = env.ctx, w = env.w, h = env.h;
  const raw = Number(state.player.sanity);
  const v = Number.isFinite(raw) ? clamp(Math.round(raw), 0, 100) : 0;
  const color = v < 40 ? '#f45b69' : v < 60 ? '#f2c14e' : '#4ade80';
  const cx = w / 2, cy = h * 0.72;
  const R = Math.min(w, h) * 0.43;
  const LW = 16;
  [[0, 25, '#f45b69'], [25, 50, '#f2c14e'], [50, 100, '#4ade80']].forEach(function (b) {
    ctx.beginPath();
    ctx.lineWidth = LW;
    ctx.strokeStyle = b[2];
    ctx.arc(cx, cy, R, Math.PI + Math.PI * b[0] / 100, Math.PI + Math.PI * b[1] / 100);
    ctx.stroke();
  });
  ctx.strokeStyle = '#0c0c18';
  ctx.lineWidth = 2;
  for (let i = 0; i <= 10; i++) {
    const a = Math.PI + Math.PI * i / 10;
    const r1 = R - LW / 2, r2 = r1 + (i % 5 === 0 ? 12 : 6);
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
    ctx.stroke();
  }
  const pa = Math.PI + Math.PI * v / 100;
  ctx.strokeStyle = '#e9e9f4';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(pa) * (R - LW - 14), cy + Math.sin(pa) * (R - LW - 14));
  ctx.lineTo(cx + Math.cos(pa) * (R - LW - 4), cy + Math.sin(pa) * (R - LW - 4));
  ctx.stroke();
  ctx.beginPath();
  ctx.fillStyle = '#e9e9f4';
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.font = '28px "Fusion Pixel 12px Mono latin","Zpix","微软雅黑",monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(v), cx, cy + R * 0.34);
  ctx.fillStyle = '#8585a0';
  ctx.font = CHART_FONT;
  ctx.fillText('0', cx - R, cy + 18);
  ctx.fillText('100', cx + R, cy + 18);
}

/* ---------- 排课面板 ---------- */
function validateGrid(g) {
  const majorN = { java: 0, web: 0, db: 0, android: 0 };
  const publicN = { politics: 0, startup: 0, pe: 0 };
  const dayMajor = [0, 0, 0, 0, 0];
  let total = 0;
  for (let d = 0; d < 5; d++) {
    for (let s = 0; s < 5; s++) {
      const id = g[d][s];
      if (!id) continue;
      total++;
      if (COURSE_DEFS[id].type === 'major') {
        majorN[id]++;
        dayMajor[d]++;
      } else {
        publicN[id]++;
      }
    }
  }
  const totalMajor = majorN.java + majorN.web + majorN.db + majorN.android;
  const errors = [];
  if (totalMajor < 10) errors.push('专业课不足 10 节');
  if (publicN.politics < 1) errors.push('政治不足 1 节');
  if (publicN.startup < 1) errors.push('创业指导不足 1 节');
  if (publicN.pe < 1) errors.push('体育不足 1 节');
  for (let d = 0; d < 5; d++) {
    if (dayMajor[d] < 1) errors.push(DAY_NAMES[d + 1] + '没有专业课');
  }
  return {
    majorN: majorN,
    publicN: publicN,
    totalMajor: totalMajor,
    total: total,
    free: 25 - total,
    errors: errors,
    ok: errors.length === 0
  };
}
